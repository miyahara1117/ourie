name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/push-notifications@^6.0.0 cordova-plugin-audiotoggle --legacy-peer-deps

      - name: Force Initialize Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Inject Call & Fullscreen Permissions into AndroidManifest.xml
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>' "$manifest"
            echo "Injected permissions successfully."
          fi

      - name: Match Package Name with google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            PACKAGE_NAME=$(node -e 'console.log(require("./google-services.json").client[0].client_info.android_client_info.package_name)')
            echo "Extracted Package Name: $PACKAGE_NAME"
            sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/g" android/app/build.gradle
          fi

      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Replace App Icon Forced
        run: |
          # icon.png のパスを確実に特定
          ICON_PATH=""
          if [ -f "www/icon.png" ]; then ICON_PATH="www/icon.png";
          elif [ -f "icon.png" ]; then ICON_PATH="icon.png";
          fi

          if [ -n "$ICON_PATH" ]; then
            echo "Icon found at: $ICON_PATH"

            # 既存のアダプティブアイコン（Capacitorデフォルトの青アイコンXML等）を完全削除
            rm -rf android/app/src/main/res/mipmap-*/ic_launcher*.xml || true
            rm -rf android/app/src/main/res/drawable*/ic_launcher*.xml || true

            # 全てのmipmapフォルダーへ画像を強制上書き配置
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp "$ICON_PATH" "android/app/src/main/res/$dir/ic_launcher.png"
              cp "$ICON_PATH" "android/app/src/main/res/$dir/ic_launcher_round.png"
              cp "$ICON_PATH" "android/app/src/main/res/$dir/ic_launcher_foreground.png"
            done
            echo "Icons replaced successfully!"
          else
            echo "Error: icon.png missing!"
            exit 1
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ourie-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
