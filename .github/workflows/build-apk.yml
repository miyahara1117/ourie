name: Build Android APKon:
push:
branches:
- main
workflow_dispatch:jobs:
build:
runs-on: ubuntu-lateststeps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: zulu
      java-version: 17

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install dependencies
    run: |
      npm install
      npm install -g @capacitor/assets

  - name: Add Android platform
    run: npx cap add android || true

  - name: Add microphone permission
    run: |
      sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml || true

  - name: Sync Web assets & Generate Icons
    run: |
      if [ -f "www/icon.jpg" ]; then
        cp www/icon.jpg www/icon.png || true
      fi
      npx cap sync android

  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Ourie-App-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
