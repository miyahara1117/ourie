name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/push-notifications@^6.0.0 cordova-plugin-audiotoggle --legacy-peer-deps

      - name: Force Initialize Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Inject Call & Fullscreen Permissions into AndroidManifest.xml
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' "$manifest"
            echo "Injected permissions successfully."
          fi

      - name: Match Package Name and Generate MainActivity
        run: |
          PACKAGE_NAME="com.ourie.timecapsule"
          if [ -f "google-services.json" ]; then
            EXTRACTED=$(node -e 'console.log(require("./google-services.json").client[0].client_info.android_client_info.package_name)')
            if [ -n "$EXTRACTED" ]; then
              PACKAGE_NAME="$EXTRACTED"
            fi
            sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/g" android/app/build.gradle
          fi
          echo "Package Name used: $PACKAGE_NAME"

          # パッケージ名に合わせたディレクトリ作成とクリーンなMainActivity.javaの生成
          DIR_PATH="android/app/src/main/java/$(echo $PACKAGE_NAME | tr '.' '/')"
          mkdir -p "$DIR_PATH"

          python3 -c "
pkg = '$PACKAGE_NAME'
code = f'''package {pkg};

import android.os.Bundle;
import android.media.AudioManager;
import android.content.Context;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {{
    @Override
    public void onCreate(Bundle savedInstanceState) {{
        super.onCreate(savedInstanceState);
        try {{
            AudioManager audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
            if (audioManager != null) {{
                audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                audioManager.setSpeakerphoneOn(false);
            }}
        }} catch (Exception e) {{
            e.printStackTrace();
        }}
    }}
}}
'''
with open('$DIR_PATH/MainActivity.java', 'w') as f:
    f.write(code)
"
          echo "MainActivity.java successfully generated."

      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Replace App Icon Forced
        run: |
          ICON_PATH=""
          if [ -f "www/icon.png" ]; then ICON_PATH="www/icon.png";
          elif [ -f "icon.png" ]; then ICON_PATH="icon.png";
          fi

          if [ -n "$ICON_PATH" ]; then
            rm -rf android/app/src/main/res/mipmap-*/ic_launcher*.xml || true
            rm -rf android/app/src/main/res/drawable*/ic_launcher*.xml || true

            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp "$ICON_PATH" "android/app/src/main/res/$dir/ic_launcher.png"
              cp "$ICON_PATH" "android/app/src/main/res/$dir/ic_launcher_round.png"
              cp "$ICON_PATH" "android/app/src/main/res/$dir/ic_launcher_foreground.png"
            done
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ourie-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
