name: Build Android APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: zulu
      java-version: 17

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install dependencies
    run: npm install

  - name: Add Android platform
    run: npx cap add android || true

  - name: Sync Web assets
    run: npx cap sync android

  - name: Add microphone permission
    run: |
      node -e "
      const fs = require('fs');
      const file = 'android/app/src/main/AndroidManifest.xml';
      if (fs.existsSync(file)) {
        let content = fs.readFileSync(file, 'utf8');
        if (!content.includes('RECORD_AUDIO')) {
          const perm = '    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n</manifest>';
          content = content.replace('</manifest>', perm);
          fs.writeFileSync(file, content);
        }
      }
      "

  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Ourie-App-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
