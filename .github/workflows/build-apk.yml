name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/push-notifications@^6.0.0 cordova-plugin-audiotoggle --legacy-peer-deps

      - name: Force Initialize Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Inject Call & Fullscreen Permissions into AndroidManifest.xml
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>' "$manifest"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>' "$manifest"
            echo "Injected permissions successfully."
          fi

      - name: Match Package Name with google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            PACKAGE_NAME=$(node -e 'console.log(require("./google-services.json").client[0].client_info.android_client_info.package_name)')
            echo "Extracted Package Name: $PACKAGE_NAME"
            sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/g" android/app/build.gradle
          fi

      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Replace App Icon with Padding
        run: |
          icon_src=""
          if [ -f "www/icon.png" ]; then icon_src="www/icon.png";
          elif [ -f "icon.png" ]; then icon_src="icon.png";
          fi

          if [ -n "$icon_src" ]; then
            python3 -c '
            from PIL import Image
            import os

            src_path = "'"$icon_src"'"
            img = Image.open(src_path).convert("RGBA")
            
            sizes = {
                "mipmap-mdpi": 48,
                "mipmap-hdpi": 72,
                "mipmap-xhdpi": 96,
                "mipmap-xxhdpi": 144,
                "mipmap-xxxhdpi": 192
            }

            for dir_name, size in sizes.items():
                target_dir = f"android/app/src/main/res/{dir_name}"
                os.makedirs(target_dir, exist_ok=True)
                
                canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
                scaled_size = int(size * 0.75)
                scaled_img = img.resize((scaled_size, scaled_size), Image.LANCZOS)
                
                offset = (size - scaled_size) // 2
                canvas.paste(scaled_img, (offset, offset), scaled_img)
                
                canvas.save(f"{target_dir}/ic_launcher.png")
                canvas.save(f"{target_dir}/ic_launcher_round.png")
            print("Padded icons generated successfully.")
            '
          fi

          if [ -n "$icon_src" ]; then
            echo "Found app icon: $icon_src"
            
            # デフォルトのアダプティブアイコンXML（Capacitor標準ロゴ）を削除して画像を優先させる
            rm -rf android/app/src/main/res/mipmap-*/ic_launcher_foreground.xml || true
            rm -rf android/app/src/main/res/mipmap-*/ic_launcher_background.xml || true
            rm -rf android/app/src/main/res/drawable/ic_launcher_background.xml || true
            rm -rf android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml || true

            # アイコン画像を各解像度へコピー
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp "$icon_src" "android/app/src/main/res/$dir/ic_launcher.png"
              cp "$icon_src" "android/app/src/main/res/$dir/ic_launcher_round.png"
              cp "$icon_src" "android/app/src/main/res/$dir/ic_launcher_foreground.png"
            done
            echo "App icon completely replaced."
          else
            echo "Error: Icon file not found in root or www directory!"
            exit 1
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ourie-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
