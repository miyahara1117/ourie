name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/push-notifications@^6.0.0 --legacy-peer-deps

      - name: Force Initialize Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Match Package Name with google-services.json
        run: |
          python3 -c '
          import json, os, re

          # google-services.json から package_name を自動取得
          gs_path = "google-services.json"
          package_name = "com.ourie.timecapsule" # デフォルト
          
          if os.path.exists(gs_path):
              with open(gs_path, "r") as f:
                  gs_data = json.load(f)
                  try:
                      package_name = gs_data["client"][0]["client_info"]["android_client_info"]["package_name"]
                      print(f"Detected package_name from google-services.json: {package_name}")
                  except Exception as e:
                      print("Could not extract package_name, using default.")

          # build.gradle の appId を自動書き換え
          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r") as f:
                  content = f.read()
              
              updated_content = re.sub(r"applicationId\s+[\"'].*?[\"']", f"applicationId \"{package_name}\"", content)
              with open(gradle_path, "w") as f:
                  f.write(updated_content)
              print("Updated android/app/build.gradle with correct applicationId.")
          '

      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ourie-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
