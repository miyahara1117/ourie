  - name: Node.js セットアップ
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Java (JDK 17) セットアップ
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Android SDK セットアップ
    uses: android-actions/setup-android@v3

  - name: 依存関係のインストール
    run: npm install

  - name: Capacitor Androidプラットフォーム追加
    run: |
      if [ ! -d "android" ]; then
        npx cap add android
      fi

  - name: マイク権限・MainActivity設定を注入
    run: |
      python3 -c "
      import os
      manifest_path = 'android/app/src/main/AndroidManifest.xml'
      if os.path.exists(manifest_path):
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()
          perms = '\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n    <uses-feature android:name=\"android.hardware.microphone\" android:required=\"true\" />\n'
          if 'RECORD_AUDIO' not in content:
              content = content.replace('</manifest>', perms + '</manifest>')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
      "
      mkdir -p android/app/src/main/java/com/ourie/timecapsule
      cat << 'EOF' > android/app/src/main/java/com/ourie/timecapsule/MainActivity.java
      package com.ourie.timecapsule;

      import android.os.Bundle;
      import android.Manifest;
      import androidx.core.app.ActivityCompat;
      import com.getcapacitor.BridgeActivity;

      public class MainActivity extends BridgeActivity {
          @Override
          public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              ActivityCompat.requestPermissions(this, new String[]{
                  Manifest.permission.RECORD_AUDIO,
                  Manifest.permission.MODIFY_AUDIO_SETTINGS
              }, 101);
          }
      }
      EOF

  - name: Webアセット同期
    run: npx cap sync android

  - name: APKビルド
    working-directory: android
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: 完成したAPKの保存
    uses: actions/upload-artifact@v4
    with:
      name: Ourie-App-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
