<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ourie</title>
  <link rel="icon" id="app-favicon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- Chosen Palette: Slate & Purple Night Theme -->
  <!-- Application Structure Plan: Single-page interactive phone time-capsule app with responsive viewport height (100dvh) fitting cleanly on Pixel 7 Pro and mobile screens without requiring scrolling. Added Step 2 Share & Receive features via URL parameters. -->
  <!-- Visualization & Content Choices: Compact Tailwind spacing, optimized mic button dimensions, dynamic audio routing, URL sharing modal, instant incoming call trigger upon URL reception. CONFIRMING: NO SVG, NO Mermaid JS. -->
  <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .pulse-animation {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .playing-glow {
      animation: glow 1.2s infinite alternate;
    }
    @keyframes glow {
      from { border-color: rgba(167, 139, 250, 0.4); box-shadow: 0 0 8px rgba(124, 58, 237, 0.4); }
      to { border-color: rgba(167, 139, 250, 0.9); box-shadow: 0 0 18px rgba(124, 58, 237, 0.8); }
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>
<body class="flex justify-center items-center w-full h-full bg-[#0b0f19] p-0 sm:p-2">

  <!-- Main App Shell fitting mobile viewports (100dvh) -->
  <div class="relative w-full max-w-[420px] h-full sm:h-[844px] bg-[#0F172A] sm:rounded-[36px] shadow-2xl border-0 sm:border-4 border-slate-800 overflow-hidden flex flex-col justify-between">
    
    <!-- Header Audio Output Bar (Global Toggle) -->
    <div class="bg-slate-900/90 border-b border-slate-800/80 px-3 py-2 flex items-center justify-between shrink-0 z-20">
      <div class="flex items-center space-x-2">
        <div id="header-avatar-container" class="w-7 h-7 rounded-full overflow-hidden bg-slate-800 flex items-center justify-center border border-purple-400/30">
          <img id="header-avatar-img" src="icon.png" alt="Ourie Profile" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>';">
        </div>
        <span class="text-xs font-bold tracking-wide text-white truncate max-w-[100px]" id="header-user-name">Ourie</span>
      </div>

      <!-- Global Audio Output Toggle Button -->
      <button id="global-speaker-toggle-btn" type="button" onclick="toggleGlobalSpeakerMode()"
        class="px-2.5 py-1 bg-[#1E293B] hover:bg-slate-800 border border-purple-500/40 rounded-full flex items-center space-x-1.5 transition-all cursor-pointer active:scale-95 shadow-sm">
        <i id="global-speaker-icon" class="fa-solid fa-phone-volume text-[11px] text-[#A78BFA]"></i>
        <span id="global-speaker-text" class="text-[10px] font-medium text-purple-200">受話器 (耳あて)</span>
      </button>
    </div>

    <!-- Main Content Container (Flex-1 for perfect fit without scroll) -->
    <div id="app-content" class="flex-1 overflow-y-auto p-3 pb-16 flex flex-col justify-between">
      
      <!-- Screen 1: Capsule Creation & Profile Setup -->
      <div id="screen-record" class="flex-1 flex flex-col justify-between space-y-2">
        
        <!-- Audio Output Mode Info Banner -->
        <div class="p-2 rounded-xl bg-gradient-to-r from-[#4C1D95]/50 to-[#1E293B] border border-[#7C3AED]/30 space-y-0.5 shadow-sm">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-1.5 text-[#A78BFA] text-[10px] font-bold">
              <i id="banner-mode-icon" class="fa-solid fa-ear-listen text-[10px]"></i>
              <span id="banner-output-mode-text">再生出力を「耳あて通話スピーカー」に設定中</span>
            </div>
          </div>
          <p id="banner-subtext" class="text-[9px] text-slate-300 leading-tight">
            スマホを耳に当てて通話感覚でお聴きいただけます。右上ボタンで本体スピーカーへ即座に切り替え可能です。
          </p>
        </div>

        <!-- Profile Settings Card -->
        <div class="p-2.5 bg-[#1E293B]/90 rounded-xl border border-purple-500/30 space-y-1.5 shadow-sm">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold text-purple-200 flex items-center space-x-1">
              <i class="fa-solid fa-id-card text-[#A78BFA]"></i>
              <span>自分のプロフィール設定</span>
            </span>
            <span class="text-[9px] text-slate-400">着信画面に反映されます</span>
          </div>

          <div class="flex items-center space-x-2.5">
            <!-- Avatar Upload Circle -->
            <div class="relative group cursor-pointer shrink-0" onclick="document.getElementById('avatar-file-input').click()">
              <div class="w-10 h-10 rounded-full overflow-hidden bg-slate-800 border border-purple-400/60 shadow flex items-center justify-center">
                <img id="profile-avatar-preview" src="icon.png" alt="Profile Avatar" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>';">
              </div>
              <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-80 group-hover:opacity-100 transition-opacity">
                <i class="fa-solid fa-camera text-white text-[9px]"></i>
              </div>
              <input id="avatar-file-input" type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
            </div>

            <!-- Profile Name Input -->
            <div class="flex-1 space-y-0.5">
              <label class="text-[9px] text-slate-300 font-medium">表示名（発信者名）</label>
              <input id="profile-name-input" type="text" value="過去の自分" placeholder="例: 1年前の自分、みや" 
                oninput="handleNameChange(this.value)"
                class="w-full bg-slate-900/80 text-xs text-white px-2.5 py-1 rounded-lg border border-slate-700 focus:outline-none focus:ring-1 focus:ring-[#7C3AED]">
            </div>
          </div>
        </div>

        <!-- Sender Name Input for Capsule -->
        <div class="space-y-0.5">
          <label class="text-[10px] text-slate-300 font-medium flex items-center space-x-1">
            <i class="fa-regular fa-user text-[9px] text-[#A78BFA]"></i>
            <span>今回着信させる表示名</span>
          </label>
          <input id="sender-input" type="text" value="過去の自分" placeholder="例: 1年前の自分" 
            class="w-full bg-[#1E293B] text-xs text-white px-2.5 py-1 rounded-xl border border-slate-700/60 focus:outline-none focus:ring-1 focus:ring-[#7C3AED]">
        </div>

        <!-- Compact Recording Console -->
        <div class="p-2.5 bg-[#1E293B] rounded-2xl border border-slate-700/60 text-center space-y-1 shadow-inner">
          <button id="mic-btn" type="button" onclick="startOrStopRecording()" 
            class="w-12 h-12 rounded-full bg-[#7C3AED] text-white flex items-center justify-center mx-auto transition-all shadow-md shadow-[#7C3AED]/40 active:scale-95 cursor-pointer">
            <i id="mic-icon" class="fa-solid fa-microphone text-lg"></i>
          </button>
          <p id="mic-status" class="text-[10px] text-slate-300 font-medium leading-tight">マイクボタンを押して録音開始</p>

          <!-- Preview & Output Mode Controls Area -->
          <div id="preview-container" class="hidden pt-1 border-t border-slate-700/50 space-y-1">
            <div class="flex justify-center items-center space-x-2">
              <button id="preview-play-btn" type="button" onclick="playPreview()" 
                class="px-2.5 py-1 bg-[#4C1D95] hover:bg-[#5b21b6] text-white text-[10px] font-semibold rounded-lg flex items-center space-x-1 border border-purple-400/30 transition-all cursor-pointer">
                <i id="preview-icon" class="fa-solid fa-play text-[9px] text-purple-200"></i>
                <span id="preview-text">録音を再生</span>
              </button>

              <button type="button" onclick="toggleGlobalSpeakerMode()" 
                class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-purple-200 text-[10px] font-medium rounded-lg border border-slate-600 flex items-center space-x-1 transition-all cursor-pointer">
                <i class="fa-solid fa-arrows-rotate text-[9px] text-amber-300"></i>
                <span id="console-speaker-toggle-text">受話器 ⇄ スピーカー</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Date & Time Selector -->
        <div class="space-y-0.5">
          <label class="text-[10px] text-slate-300 font-medium flex items-center space-x-1">
            <i class="fa-regular fa-clock text-[9px] text-[#A78BFA]"></i>
            <span>お届け日時を指定（未来の着信日時）</span>
          </label>
          <input id="datetime-input" type="datetime-local" 
            class="w-full bg-[#1E293B] text-xs text-white px-2.5 py-1 rounded-xl border border-slate-700/60 focus:outline-none focus:ring-1 focus:ring-[#7C3AED]">
        </div>

        <!-- Action Buttons Grid (Save Locally / Share Link) -->
        <div class="grid grid-cols-2 gap-2 pt-0.5">
          <button id="submit-btn" type="button" disabled onclick="saveCapsule()" 
            class="py-2 bg-slate-800 text-slate-500 font-bold text-[11px] rounded-xl flex items-center justify-center space-x-1 transition-all">
            <i class="fa-solid fa-paper-plane text-[10px]"></i>
            <span>自分用にタイマー保存</span>
          </button>

          <button id="share-btn" type="button" disabled onclick="generateShareUrl()" 
            class="py-2 bg-slate-800 text-slate-500 font-bold text-[11px] rounded-xl flex items-center justify-center space-x-1 transition-all">
            <i class="fa-solid fa-share-nodes text-[10px]"></i>
            <span>共有URL発行 (LINE等)</span>
          </button>
        </div>

      </div>

      <!-- Screen 2: History & Capsules -->
      <div id="screen-history" class="hidden space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-white flex items-center space-x-1.5">
            <i class="fa-solid fa-box-archive text-[#A78BFA]"></i>
            <span>蓄積履歴 & 封印カプセル</span>
          </h2>
          <span id="capsule-count" class="text-xs text-slate-400">0件</span>
        </div>
        <div id="capsule-list" class="space-y-2.5"></div>
      </div>

    </div>

    <!-- Bottom Navigation Bar (Fixed at bottom) -->
    <div class="absolute bottom-0 left-0 right-0 h-14 bg-[#0F172A] border-t border-slate-800/80 flex justify-around items-center px-4 z-10">
      <button id="nav-record" type="button" onclick="switchTab('record')" class="flex flex-col items-center space-y-0.5 text-[#A78BFA]">
        <i class="fa-solid fa-microphone text-base"></i>
        <span class="text-[9px] font-medium">カプセル作成</span>
      </button>
      <button id="nav-history" type="button" onclick="switchTab('history')" class="flex flex-col items-center space-y-0.5 text-slate-400">
        <i class="fa-solid fa-clock-rotate-left text-base"></i>
        <span class="text-[9px] font-medium">蓄積履歴</span>
      </button>
    </div>

    <!-- Share Link Modal -->
    <div id="share-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-slate-900 border border-purple-500/40 w-full max-w-xs rounded-2xl p-4 space-y-3 shadow-2xl text-center">
        <div class="w-10 h-10 rounded-full bg-purple-900/60 border border-purple-400/50 flex items-center justify-center mx-auto text-purple-200">
          <i class="fa-solid fa-paper-plane text-base"></i>
        </div>
        <h3 class="text-sm font-bold text-white">タイムカプセル共有URL</h3>
        <p class="text-[10px] text-slate-300 leading-tight">以下のURLを相手に送ると、相手のスマホであなたのタイムカプセル通話が再現されます！</p>
        
        <input id="share-url-input" type="text" readonly class="w-full bg-slate-950 text-[10px] text-purple-300 px-2 py-1.5 rounded-lg border border-slate-800 select-all font-mono">

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button type="button" onclick="copyShareUrl()" class="py-2 bg-purple-700 hover:bg-purple-600 text-white font-bold text-[11px] rounded-xl flex items-center justify-center space-x-1 cursor-pointer">
            <i class="fa-regular fa-copy text-[10px]"></i>
            <span>URLをコピー</span>
          </button>
          <button type="button" onclick="sendLineShare()" class="py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px] rounded-xl flex items-center justify-center space-x-1 cursor-pointer">
            <i class="fa-brands fa-line text-xs"></i>
            <span>LINEで送る</span>
          </button>
        </div>

        <button type="button" onclick="closeShareModal()" class="w-full py-1.5 bg-slate-800 text-slate-400 text-[10px] font-medium rounded-lg cursor-pointer">
          閉じる
        </button>
      </div>
    </div>

    <!-- Receive Call Modal (When opening a shared URL) -->
    <div id="receive-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
      <div class="bg-slate-900 border border-purple-500/50 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl text-center">
        <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-purple-400 shadow-xl mx-auto bg-slate-800">
          <img id="receive-avatar-img" src="icon.png" class="w-full h-full object-cover">
        </div>
        <div>
          <h3 id="receive-sender-name" class="text-base font-bold text-white">過去の自分</h3>
          <p class="text-[11px] text-purple-300 mt-0.5">から音声タイムカプセルが届いています！</p>
        </div>
        <button type="button" onclick="acceptReceivedCall()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-2xl flex items-center justify-center space-x-2 shadow-lg shadow-emerald-500/30 animate-pulse cursor-pointer">
          <i class="fa-solid fa-phone text-sm"></i>
          <span>通話に出てメッセージを聴く</span>
        </button>
      </div>
    </div>

    <!-- Incoming Call Overlay Screen (LINE Call Styled UI) -->
    <div id="call-overlay" class="hidden absolute inset-0 bg-gradient-to-b from-slate-950 via-slate-900 to-black z-50 p-6 flex flex-col justify-between items-center text-center">
      
      <!-- Top Call Header / Profile Info -->
      <div class="mt-6 space-y-3 w-full flex flex-col items-center">
        <!-- Large Rounded Profile Avatar Frame -->
        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full overflow-hidden border-4 border-purple-400/40 shadow-2xl shadow-indigo-500/30 bg-slate-800 flex items-center justify-center">
          <img id="call-avatar-img" src="icon.png" alt="Caller Avatar" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>';">
        </div>
        
        <div>
          <h3 id="call-sender-name" class="text-xl font-bold text-white tracking-wide">過去の自分</h3>
          <p id="call-status-text" class="text-xs text-[#A78BFA] mt-1 font-medium tracking-wider">未来からの着信...</p>
        </div>

        <!-- Speaker Output Toggle Button (Call Screen) -->
        <div id="speaker-toggle-container" class="hidden pt-1">
          <button id="speaker-toggle-btn" type="button" onclick="toggleGlobalSpeakerMode()" 
            class="px-3.5 py-1.5 bg-slate-800/90 hover:bg-slate-700 text-purple-300 text-xs font-semibold rounded-full border border-purple-500/40 inline-flex items-center space-x-1.5 shadow-md transition-all active:scale-95 cursor-pointer">
            <i id="call-speaker-icon" class="fa-solid fa-phone-volume text-xs"></i>
            <span id="call-speaker-text">受話器（耳あて）モード</span>
          </button>
        </div>
      </div>

      <!-- Reply Recording Area during Call -->
      <div id="reply-area" class="hidden w-full max-w-xs bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3 space-y-2 text-center my-auto shadow-xl">
        <div class="flex items-center justify-center space-x-1 text-xs text-purple-300 font-bold">
          <i class="fa-solid fa-reply text-xs"></i>
          <span>相手へ返答を録音</span>
        </div>
        <p id="reply-status" class="text-[10px] text-slate-400">マイクボタンを押して返答を吹き込む</p>
        
        <div class="flex justify-center items-center space-x-3">
          <button id="reply-mic-btn" type="button" onclick="toggleReplyRecording()" 
            class="w-10 h-10 rounded-full bg-purple-600 text-white flex items-center justify-center shadow-md active:scale-95 transition-all cursor-pointer">
            <i id="reply-mic-icon" class="fa-solid fa-microphone text-sm"></i>
          </button>

          <button id="reply-play-btn" type="button" onclick="playReplyPreview()" class="hidden px-2.5 py-1.5 bg-slate-800 text-purple-300 text-xs font-medium rounded-xl flex items-center space-x-1 border border-purple-500/30 cursor-pointer">
            <i id="reply-play-icon" class="fa-solid fa-play text-xs"></i>
            <span id="reply-play-text">返答を確認</span>
          </button>
        </div>
      </div>

      <!-- Call Action Buttons -->
      <div class="mb-6 flex justify-center items-center space-x-10 w-full">
        <button id="end-call-btn" type="button" onclick="endCall()" class="w-14 h-14 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center shadow-lg shadow-red-500/40 active:scale-95 transition-all cursor-pointer">
          <i class="fa-solid fa-phone-slash text-xl"></i>
        </button>
        <button id="accept-call-btn" type="button" onclick="acceptCall()" class="w-14 h-14 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center shadow-lg shadow-emerald-500/40 animate-bounce active:scale-95 transition-all cursor-pointer">
          <i class="fa-solid fa-phone text-xl"></i>
        </button>
      </div>
    </div>

  </div>

  <script>
    let isRecording = false;
    let recordedAudioBlob = null;
    let audioUrl = null;
    let audioBase64Data = null;
    let capsules = [];
    let callTimerInterval = null;
    let callSeconds = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentStream = null;

    let activeCallingCapsule = null;
    let ringtoneAudioCtx = null;
    let ringtoneOscillator = null;

    let isReplyRecording = false;
    let replyMediaRecorder = null;
    let replyAudioChunks = [];
    let replyAudioBlob = null;
    let replyAudioUrl = null;

    let userAvatarData = null;
    let userName = "過去の自分";
    let isSpeakerMode = false;

    let currentAudioElement = null;
    let activeAudioCtx = null;
    let activeAudioSource = null;
    let currentPlayingUrl = null;
    let currentOnEndedHandler = null;

    window.onload = () => {
      const savedAvatar = localStorage.getItem('ourie_user_avatar');
      const savedName = localStorage.getItem('ourie_user_name');
      
      if (savedAvatar) {
        userAvatarData = savedAvatar;
        updateAvatarDisplay(userAvatarData);
      }
      if (savedName) {
        userName = savedName;
        document.getElementById('profile-name-input').value = userName;
        document.getElementById('sender-input').value = userName;
        document.getElementById('header-user-name').innerText = userName;
      }

      const now = new Date();
      now.setMinutes(now.getMinutes() + 1);
      const localDatetime = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      const dateInput = document.getElementById('datetime-input');
      if (dateInput) dateInput.value = localDatetime;
      renderCapsules();
      updateSpeakerUI();

      // Check if opened via Shared URL (?data=...)
      checkSharedUrlParameters();
    };

    function checkSharedUrlParameters() {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedData = urlParams.get('data');
      if (sharedData) {
        try {
          const parsed = JSON.parse(decodeURIComponent(sharedData));
          if (parsed && parsed.audioData) {
            activeCallingCapsule = {
              senderName: parsed.senderName || '友人',
              senderAvatar: parsed.senderAvatar || null,
              audioUrl: parsed.audioData
            };
            document.getElementById('receive-sender-name').innerText = activeCallingCapsule.senderName;
            if (activeCallingCapsule.senderAvatar) {
              document.getElementById('receive-avatar-img').src = activeCallingCapsule.senderAvatar;
            }
            document.getElementById('receive-modal').classList.remove('hidden');
          }
        } catch(e) {
          console.error("Shared URL parse error:", e);
        }
      }
    }

    function acceptReceivedCall() {
      document.getElementById('receive-modal').classList.add('hidden');
      if (activeCallingCapsule) {
        triggerIncomingCall(activeCallingCapsule);
      }
    }

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        userAvatarData = e.target.result;
        localStorage.setItem('ourie_user_avatar', userAvatarData);
        updateAvatarDisplay(userAvatarData);
      };
      reader.readAsDataURL(file);
    }

    function updateAvatarDisplay(avatarSrc) {
      if (!avatarSrc) return;
      const previewImg = document.getElementById('profile-avatar-preview');
      const headerImg = document.getElementById('header-avatar-img');
      const callAvatarImg = document.getElementById('call-avatar-img');

      if (previewImg) previewImg.src = avatarSrc;
      if (headerImg) headerImg.src = avatarSrc;
      if (callAvatarImg) callAvatarImg.src = avatarSrc;
    }

    function handleNameChange(val) {
      userName = val.trim() || '過去の自分';
      localStorage.setItem('ourie_user_name', userName);
      document.getElementById('sender-input').value = userName;
      document.getElementById('header-user-name').innerText = userName;
    }

    function toggleGlobalSpeakerMode() {
      isSpeakerMode = !isSpeakerMode;
      updateSpeakerUI();

      if (currentAudioElement || activeAudioSource) {
        applyCurrentAudioRoute();
      }
    }

    function updateSpeakerUI() {
      const globalBtn = document.getElementById('global-speaker-toggle-btn');
      const globalIcon = document.getElementById('global-speaker-icon');

    function forceEarpieceAudioCycle() {
      if (!isSpeakerMode) {
        setNativeAudioMode('SPEAKER');
        setTimeout(() => setNativeAudioMode('EARPIECE'), 30);
        setTimeout(() => setNativeAudioMode('EARPIECE'), 120);
        setTimeout(() => setNativeAudioMode('EARPIECE'), 300);
      } else {
        setNativeAudioMode('SPEAKER');
      }
    }

    async function applyCurrentAudioRoute(audioEl = currentAudioElement) {
      const mode = isSpeakerMode ? 'SPEAKER' : 'EARPIECE';
      setNativeAudioMode(mode);

      if (audioEl && typeof audioEl.setSinkId === 'function') {
        try {
          if (!isSpeakerMode) {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const earpiece = devices.find(d => 
              d.kind === 'audiooutput' && 
              (d.label.toLowerCase().includes('earpiece') || 
               d.label.toLowerCase().includes('receiver') || 
               d.label.toLowerCase().includes('telephony') || 
               d.deviceId === 'communications')
            );
            if (earpiece) {
              await audioEl.setSinkId(earpiece.deviceId);
            } else if (devices.some(d => d.deviceId === 'communications')) {
              await audioEl.setSinkId('communications');
            }
          } else {
            await audioEl.setSinkId('');
          }
        } catch(e) {
          console.warn("setSinkId route error:", e);
        }
      }
    }

    function setNativeAudioMode(mode) {
      if (window.AudioToggle && typeof window.AudioToggle.setAudioMode === 'function') {
        try {
          if (mode === 'EARPIECE') {
            window.AudioToggle.setAudioMode(window.AudioToggle.EARPIECE);
          } else if (mode === 'SPEAKER') {
            window.AudioToggle.setAudioMode(window.AudioToggle.SPEAKER);
          } else {
            window.AudioToggle.setAudioMode(window.AudioToggle.NORMAL);
          }
        } catch (e) {
          console.warn("AudioToggle plugin error:", e);
        }
      }
    }

    function stopCurrentAudio() {
      if (currentAudioElement) {
        try {
          currentAudioElement.pause();
          currentAudioElement.currentTime = 0;
        } catch(e){}
        currentAudioElement = null;
      }
      if (activeAudioSource) {
        try { activeAudioSource.stop(); } catch(e){}
        activeAudioSource = null;
      }
      if (activeAudioCtx) {
        try { activeAudioCtx.close(); } catch(e){}
        activeAudioCtx = null;
      }

      currentPlayingUrl = null;
      setNativeAudioMode('NORMAL');

      if (currentOnEndedHandler) {
        const handler = currentOnEndedHandler;
        currentOnEndedHandler = null;
        handler();
      }
    }

    async function playAudioWithEarpieceRouting(url, onEnded) {
      if (currentPlayingUrl === url) {
        stopCurrentAudio();
        return;
      }

      stopCurrentAudio();
      currentPlayingUrl = url;
      currentOnEndedHandler = onEnded;

      const audio = new Audio(url);
      currentAudioElement = audio;

      await applyCurrentAudioRoute(audio);

      audio.onended = () => {
        stopCurrentAudio();
      };

      audio.onerror = (e) => {
        console.warn("HTMLAudioElement failed, attempting Web Audio API:", e);
        playAudioWithWebAudioFallback(url, onEnded);
      };

      audio.onplaying = () => {
        forceEarpieceAudioCycle();
      };

      try {
        await audio.play();
        forceEarpieceAudioCycle();
      } catch (err) {
        console.warn("HTMLAudioElement play blocked, attempting Web Audio API fallback:", err);
        playAudioWithWebAudioFallback(url, onEnded);
      }
    }

    async function playAudioWithWebAudioFallback(url, onEnded) {
      try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();

        activeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedData = await activeAudioCtx.decodeAudioData(arrayBuffer);

        activeAudioSource = activeAudioCtx.createBufferSource();
        activeAudioSource.buffer = decodedData;

        activeAudioSource.connect(activeAudioCtx.destination);

        activeAudioSource.onended = () => {
          stopCurrentAudio();
        };

        activeAudioSource.start(0);
        forceEarpieceAudioCycle();
      } catch(err) {
        console.error("Audio playback completely failed:", err);
        stopCurrentAudio();
      }
    }

    function stopActiveStream() {
      if (currentStream) {
        try {
          currentStream.getTracks().forEach(track => track.stop());
        } catch(e) {
          console.warn("Track stop error:", e);
        }
        currentStream = null;
      }
    }

    async function getAudioStream() {
      const constraintsList = [
        { audio: true },
        { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } },
        { audio: { channelCount: 1 } },
        { audio: { sampleRate: 44100 } }
      ];

      let lastError = null;
      for (const constraints of constraintsList) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream && stream.getAudioTracks().length > 0) {
            return stream;
          }
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("マイクを起動できませんでした");
    }

    async function startOrStopRecording() {
      const micBtn = document.getElementById('mic-btn');
      const micIcon = document.getElementById('mic-icon');
      const micStatus = document.getElementById('mic-status');
      const previewContainer = document.getElementById('preview-container');

      stopCurrentAudio();

      if (!isRecording) {
        micStatus.innerText = "マイクを起動中...";

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          micStatus.innerText = "お使いの環境はマイク録音に未対応です";
          alert("この端末環境ではマイク機能がサポートされていません。");
          return;
        }

        stopActiveStream();

        try {
          currentStream = await getAudioStream();
          audioChunks = [];

          let options = {};
          if (typeof MediaRecorder !== 'undefined') {
            if (MediaRecorder.isTypeSupported('audio/webm')) {
              options = { mimeType: 'audio/webm' };
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
              options = { mimeType: 'audio/mp4' };
            } else if (MediaRecorder.isTypeSupported('audio/aac')) {
              options = { mimeType: 'audio/aac' };
            }
          }

          mediaRecorder = new MediaRecorder(currentStream, options);

          mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = () => {
            const mimeType = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'audio/mp4';
            recordedAudioBlob = new Blob(audioChunks, { type: mimeType });
            audioUrl = URL.createObjectURL(recordedAudioBlob);

            // Convert Blob to Base64 for Sharing
            const reader = new FileReader();
            reader.onloadend = () => {
              audioBase64Data = reader.result;
            };
            reader.readAsDataURL(recordedAudioBlob);

            if (previewContainer) previewContainer.classList.remove('hidden');
            enableSubmitButtons();
            stopActiveStream();
          };

          mediaRecorder.start(100);
          isRecording = true;
          micBtn.className = "w-12 h-12 rounded-full bg-red-500 text-white flex items-center justify-center mx-auto pulse-animation cursor-pointer";
          micIcon.className = "fa-solid fa-square text-lg";
          micStatus.innerText = "録音中... タップで停止";
        } catch (err) {
          console.error("録音起動エラー:", err);
          isRecording = false;
          stopActiveStream();
          
          micBtn.className = "w-12 h-12 rounded-full bg-[#7C3AED] text-white flex items-center justify-center mx-auto shadow-md shadow-[#7C3AED]/40 active:scale-95 cursor-pointer";
          micIcon.className = "fa-solid fa-microphone text-lg";

          micStatus.innerText = "エラー: " + (err.name || "マイクを開けません");
          alert("マイクの起動に失敗しました: " + (err.message || err.name));
        }
      } else {
        try {
          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
          }
        } catch (e) {
          console.error(e);
        }
        isRecording = false;
        micBtn.className = "w-12 h-12 rounded-full bg-[#7C3AED] text-white flex items-center justify-center mx-auto shadow-md shadow-[#7C3AED]/40 active:scale-95 cursor-pointer";
        micIcon.className = "fa-solid fa-microphone text-lg";
        micStatus.innerText = "録音完了！再生して確認できます";
      }
    }

      const previewIcon = document.getElementById('preview-icon');

    function saveCapsule() {
      const senderName = document.getElementById('sender-input').value.trim() || '過去の自分';
      const targetTimeVal = document.getElementById('datetime-input').value;
      if (!targetTimeVal || !audioUrl) return;

      const targetTime = new Date(targetTimeVal);
      const delayMs = targetTime.getTime() - Date.now();

      const capsule = {
        id: Date.now(),
        senderName: senderName,
        senderAvatar: userAvatarData,
        targetTime: targetTime,
        audioUrl: audioUrl,
        replyAudioUrl: null
      };

      capsules.push(capsule);
      renderCapsules();

      if (delayMs > 0) {
        setTimeout(() => triggerIncomingCall(capsule), delayMs);
      } else {
        setTimeout(() => triggerIncomingCall(capsule), 3000);
      }

      const previewContainer = document.getElementById('preview-container');
      if (previewContainer) previewContainer.classList.add('hidden');
      document.getElementById('mic-status').innerText = "マイクボタンを押して録音開始";
      
      alert("タイムカプセルをセットしました！指定日時になると着信します。");
    }

    function generateShareUrl() {
      if (!audioBase64Data && !audioUrl) {
        alert("メッセージを録音してください。");
        return;
      }

      const senderName = document.getElementById('sender-input').value.trim() || userName;
      const dataPayload = {
        senderName: senderName,
        senderAvatar: userAvatarData,
        audioData: audioBase64Data || audioUrl
      };

      const baseUrl = window.location.origin + window.location.pathname;
      const fullShareUrl = baseUrl + '?data=' + encodeURIComponent(JSON.stringify(dataPayload));

      document.getElementById('share-url-input').value = fullShareUrl;
      document.getElementById('share-modal').classList.remove('hidden');
    }

    function copyShareUrl() {
      const input = document.getElementById('share-url-input');
      input.select();
      navigator.clipboard.writeText(input.value);
      alert("URLをコピーしました！LINE等で送信してください。");

      const text = `${senderName}からタイムカプセル通話が届いています！以下のURLを開いて通話をお受け取りください：\n${url}`;

          <p class="text-xs text-slate-400">現在セットされているカプセルはありません。</p>

      list.innerHTML = capsules.map(c => `

                <img src="${c.senderAvatar || 'icon.png'}" alt="Icon" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>';">
              </div>
              <div>
                <p class="text-xs font-bold text-white">${c.senderName}</p>
                <p class="text-[10px] text-slate-400">着信: ${c.targetTime.getFullYear()}/${c.targetTime.getMonth()+1}/${c.targetTime.getDate()} ${String(c.targetTime.getHours()).padStart(2,'0')}:${String(c.targetTime.getMinutes()).padStart(2,'0')}</p>
              </div>

            <button type="button" onclick="deleteCapsule(${c.id})" class="text-slate-500 hover:text-red-400 p-1.5 transition-colors">
              <i class="fa-regular fa-trash-can text-xs"></i>

          </div>

          <div class="flex items-center space-x-2 pt-1.5 border-t border-slate-800">
            <button type="button" onclick="playSavedAudio('${c.audioUrl}', this)" class="px-2.5 py-1 bg-[#4C1D95] hover:bg-[#5b21b6] text-white text-[11px] font-medium rounded-lg flex items-center space-x-1 border border-purple-500/30 transition-all cursor-pointer">

          </div>
        </div>
      `).join('');
    }

    function playSavedAudio(url, btnElement) {
      if (!url) return;

      const icon = btnElement.querySelector('i');

      if (currentPlayingUrl === url) {
        stopCurrentAudio();
        if (icon) icon.className = "fa-solid fa-play text-[9px]";
        btnElement.classList.remove('playing-glow');
        return;
      }

      if (icon) icon.className = "fa-solid fa-square text-[9px]";
      btnElement.classList.add('playing-glow');

      playAudioWithEarpieceRouting(url, () => {
        if (icon) icon.className = "fa-solid fa-play text-[9px]";
        btnElement.classList.remove('playing-glow');
      });
    }

    function deleteCapsule(id) {
      capsules = capsules.filter(c => c.id !== id);
      renderCapsules();
    }

    function startRingtone() {
      try {
        stopRingtone();
        setNativeAudioMode('SPEAKER');
        ringtoneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        ringtoneOscillator = ringtoneAudioCtx.createOscillator();
        const gainNode = ringtoneAudioCtx.createGain();

        ringtoneOscillator.type = 'sine';
        ringtoneOscillator.frequency.setValueAtTime(400, ringtoneAudioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, ringtoneAudioCtx.currentTime);

        ringtoneOscillator.connect(gainNode);
        gainNode.connect(ringtoneAudioCtx.destination);
        ringtoneOscillator.start();
      } catch(e) {
        console.warn("Ringtone error:", e);
      }
    }

    function stopRingtone() {
      if (ringtoneOscillator) {
        try { ringtoneOscillator.stop(); } catch(e){}
        ringtoneOscillator = null;
      }
      if (ringtoneAudioCtx) {
        try { ringtoneAudioCtx.close(); } catch(e){}
        ringtoneAudioCtx = null;
      }
    }

    function triggerIncomingCall(capsule) {
      activeCallingCapsule = capsule;
      replyAudioBlob = null;
      replyAudioUrl = null;

      document.getElementById('call-sender-name').innerText = capsule.senderName;
      document.getElementById('call-status-text').innerText = "未来からの着信...";
      
      const callAvatarImg = document.getElementById('call-avatar-img');
      if (callAvatarImg) {
        callAvatarImg.src = capsule.senderAvatar || userAvatarData || 'icon.png';
      }

      document.getElementById('accept-call-btn').classList.remove('hidden');
      document.getElementById('reply-area').classList.add('hidden');
      document.getElementById('speaker-toggle-container').classList.add('hidden');
      document.getElementById('call-overlay').classList.remove('hidden');

      startRingtone();
    }

    function acceptCall() {
      stopRingtone();

      document.getElementById('accept-call-btn').classList.add('hidden');
      document.getElementById('reply-area').classList.remove('hidden');
      document.getElementById('speaker-toggle-container').classList.remove('hidden');
      document.getElementById('call-status-text').innerText = "通話中: 00:00";
      callSeconds = 0;
      clearInterval(callTimerInterval);
      
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const secs = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('call-status-text').innerText = `通話中: ${mins}:${secs}`;
      }, 1000);

      if (activeCallingCapsule && activeCallingCapsule.audioUrl) {
        playAudioWithEarpieceRouting(activeCallingCapsule.audioUrl, () => {
          document.getElementById('call-status-text').innerText = "通話中 (返答録音可能)";
        });
      }
    }

    async function toggleReplyRecording() {
      const micBtn = document.getElementById('reply-mic-btn');
      const micIcon = document.getElementById('reply-mic-icon');
      const replyStatus = document.getElementById('reply-status');
      const replyPlayBtn = document.getElementById('reply-play-btn');

      stopCurrentAudio();

      if (!isReplyRecording) {
        replyStatus.innerText = "マイク起動中...";
        stopActiveStream();

        try {
          currentStream = await getAudioStream();
          replyAudioChunks = [];

          let options = {};
          if (typeof MediaRecorder !== 'undefined') {
            if (MediaRecorder.isTypeSupported('audio/webm')) {
              options = { mimeType: 'audio/webm' };
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
              options = { mimeType: 'audio/mp4' };
            }
          }

          replyMediaRecorder = new MediaRecorder(currentStream, options);

          replyMediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
              replyAudioChunks.push(event.data);
            }
          };

          replyMediaRecorder.onstop = () => {
            const mimeType = (replyMediaRecorder && replyMediaRecorder.mimeType) ? replyMediaRecorder.mimeType : 'audio/mp4';
            replyAudioBlob = new Blob(replyAudioChunks, { type: mimeType });
            replyAudioUrl = URL.createObjectURL(replyAudioBlob);

              renderCapsules();
            }

            replyPlayBtn.classList.remove('hidden');
            replyStatus.innerText = "返答を記録しました！";
            stopActiveStream();
          };

          replyMediaRecorder.start(100);
          isReplyRecording = true;

          micIcon.className = "fa-solid fa-square text-sm";
          replyStatus.innerText = "返答を録音中... タップで停止";
        } catch (err) {
          console.error("返答録音エラー:", err);
          isReplyRecording = false;
          stopActiveStream();
          replyStatus.innerText = "マイクの起動に失敗しました";
        }
      } else {
        try {
          if (replyMediaRecorder && replyMediaRecorder.state !== "inactive") {
            replyMediaRecorder.stop();
          }
        } catch (e) {
          console.error(e);
        }
        isReplyRecording = false;
        micBtn.className = "w-10 h-10 rounded-full bg-purple-600 text-white flex items-center justify-center shadow-md cursor-pointer";
        micIcon.className = "fa-solid fa-microphone text-sm";
      }
    }

    function playReplyPreview() {
      const icon = document.getElementById('reply-play-icon');
      const text = document.getElementById('reply-play-text');

      if (!replyAudioUrl) return;

      if (currentPlayingUrl === replyAudioUrl) {
        stopCurrentAudio();
        icon.className = "fa-solid fa-play text-xs";
        text.innerText = "返答を確認";
      } else {
        icon.className = "fa-solid fa-square text-xs";
        text.innerText = "再生停止";

        playAudioWithEarpieceRouting(replyAudioUrl, () => {
          icon.className = "fa-solid fa-play text-xs";
          text.innerText = "返答を確認";
        });
      }
    }

    function endCall() {
      stopRingtone();
      clearInterval(callTimerInterval);
      stopCurrentAudio();
      
      if (isReplyRecording && replyMediaRecorder) {
        try { replyMediaRecorder.stop(); } catch(e){}
      }
      stopActiveStream();

      setNativeAudioMode('NORMAL');

      document.getElementById('call-overlay').classList.add('hidden');
      activeCallingCapsule = null;
    }

    function switchTab(tab) {
      const screenRecord = document.getElementById('screen-record');
      const screenHistory = document.getElementById('screen-history');
      const navRecord = document.getElementById('nav-record');
      const navHistory = document.getElementById('nav-history');

      if (tab === 'record') {
        screenRecord.classList.remove('hidden');
        screenHistory.classList.add('hidden');
        navRecord.className = 'flex flex-col items-center space-y-0.5 text-[#A78BFA]';
        navHistory.className = 'flex flex-col items-center space-y-0.5 text-slate-400';
      } else {
        screenRecord.classList.add('hidden');
        screenHistory.classList.remove('hidden');
        navRecord.className = 'flex flex-col items-center space-y-0.5 text-slate-400';
        navHistory.className = 'flex flex-col items-center space-y-0.5 text-[#A78BFA]';
      }
    }
  </script>
</body>
</html>
