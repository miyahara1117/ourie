<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ourie</title>
  <!-- アプリアイコン (favicon) 設定 -->
  <link rel="icon" id="app-favicon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- Chosen Palette: Slate & Purple Night Theme -->
  <!-- Application Structure Plan: Single-page interactive phone time-capsule app ensuring all playback modes (record preview, capsule history, in-call incoming message, reply) route to Earpiece by default using Web Audio API decoding and native audio toggles, while allowing user override to Loudspeaker via a global switch. -->
  <!-- Visualization & Content Choices: Tailwind responsive UI, FontAwesome icons, Web Audio API + AudioToggle routing (Earpiece default + Loudspeaker toggle). CONFIRMING: NO SVG, NO Mermaid JS. -->
  <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .pulse-animation {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .playing-glow {
      animation: glow 1.2s infinite alternate;
    }
    @keyframes glow {
      from { border-color: rgba(167, 139, 250, 0.4); box-shadow: 0 0 8px rgba(124, 58, 237, 0.4); }
      to { border-color: rgba(167, 139, 250, 0.9); box-shadow: 0 0 18px rgba(124, 58, 237, 0.8); }
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

  <div class="relative w-full max-w-[390px] h-[844px] bg-[#0F172A] sm:rounded-[40px] shadow-2xl border-0 sm:border-8 border-slate-800 overflow-hidden flex flex-col justify-between">
    
    <!-- Header Audio Output Bar (Global Toggle) -->
    <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-20">
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 rounded-lg overflow-hidden bg-slate-800 flex items-center justify-center border border-purple-400/30">
          <img src="icon.png" alt="Ourie" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>';">
        </div>
        <span class="text-xs font-bold tracking-wide text-white">Ourie</span>
      </div>

      <!-- Global Audio Output Toggle Button -->
      <button id="global-speaker-toggle-btn" type="button" onclick="toggleGlobalSpeakerMode()"
        class="px-3 py-1 bg-[#1E293B] hover:bg-slate-800 border border-purple-500/40 rounded-full flex items-center space-x-1.5 transition-all cursor-pointer active:scale-95 shadow-sm">
        <i id="global-speaker-icon" class="fa-solid fa-phone-volume text-xs text-[#A78BFA]"></i>
        <span id="global-speaker-text" class="text-[11px] font-medium text-purple-200">受話器（耳あて）</span>
      </button>
    </div>

    <!-- Main Content Container -->
    <div id="app-content" class="flex-1 overflow-y-auto p-4 pb-20">
      
      <!-- Screen 1: Capsule Creation -->
      <div id="screen-record" class="block space-y-4">
        
        <!-- Audio Output Mode Info Banner -->
        <div class="p-3.5 rounded-2xl bg-gradient-to-r from-[#4C1D95]/60 to-[#1E293B] border border-[#7C3AED]/40 space-y-1 shadow-md">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-1.5 text-[#A78BFA] text-xs font-bold">
              <i class="fa-solid fa-ear-listen text-xs"></i>
              <span id="banner-output-mode-text">再生出力を「耳あて通話スピーカー」に設定中</span>
            </div>
          </div>
          <p class="text-[11px] text-slate-300 leading-relaxed">
            録音直後の確認やメッセージ再生時は、耳をスマホ上部に当てて通話感覚でお聴きいただけます。右上のボタンで本体スピーカーへ切替可能です。
          </p>
        </div>

        <!-- Sender Name Input -->
        <div class="space-y-1">
          <label class="text-xs text-slate-300 font-medium flex items-center space-x-1">
            <i class="fa-regular fa-user text-[11px] text-[#A78BFA]"></i>
            <span>着信時の発信者名</span>
          </label>
          <input id="sender-input" type="text" value="過去の自分" placeholder="例: 1年前の自分、ハタチの俺" 
            class="w-full bg-[#1E293B] text-sm text-white px-4 py-2.5 rounded-2xl border border-slate-700/60 focus:outline-none focus:ring-2 focus:ring-[#7C3AED]">
        </div>

        <!-- Recording Console -->
        <div class="p-5 bg-[#1E293B] rounded-3xl border border-slate-700/60 text-center space-y-3 shadow-inner">
          <button id="mic-btn" type="button" onclick="startOrStopRecording()" 
            class="w-20 h-20 rounded-full bg-[#7C3AED] text-white flex items-center justify-center mx-auto transition-all shadow-lg shadow-[#7C3AED]/40 active:scale-95 cursor-pointer">
            <i id="mic-icon" class="fa-solid fa-microphone text-2xl"></i>
          </button>
          <p id="mic-status" class="text-xs text-slate-300 font-medium leading-normal">マイクボタンを押して録音開始</p>

          <button id="preview-btn" type="button" onclick="playPreview()" class="hidden mx-auto px-4 py-2 bg-[#4C1D95] hover:bg-[#5b21b6] text-white text-xs font-semibold rounded-xl flex items-center space-x-2 border border-purple-400/30 transition-all">
            <i id="preview-icon" class="fa-solid fa-phone-volume text-sm text-purple-200"></i>
            <span id="preview-text">通話スピーカーで録音を確認</span>
          </button>
        </div>

        <!-- Date & Time Selector -->
        <div class="space-y-1">
          <label class="text-xs text-slate-300 font-medium flex items-center space-x-1">
            <i class="fa-regular fa-clock text-[11px] text-[#A78BFA]"></i>
            <span>お届け日時を指定（未来の着信日時）</span>
          </label>
          <input id="datetime-input" type="datetime-local" 
            class="w-full bg-[#1E293B] text-sm text-white px-4 py-2.5 rounded-2xl border border-slate-700/60 focus:outline-none focus:ring-2 focus:ring-[#7C3AED]">
        </div>

        <!-- Submit Button -->
        <button id="submit-btn" type="button" disabled onclick="saveCapsule()" 
          class="w-full py-3 bg-slate-800 text-slate-500 font-bold text-sm rounded-2xl flex items-center justify-center space-x-2 transition-all">
          <i class="fa-solid fa-paper-plane text-xs"></i>
          <span id="submit-text">未来へタイムカプセルを飛ばす</span>
        </button>
      </div>

      <!-- Screen 2: History & Capsules -->
      <div id="screen-history" class="hidden space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-bold text-white flex items-center space-x-2">
            <i class="fa-solid fa-box-archive text-[#A78BFA]"></i>
            <span>蓄積履歴 & 封印カプセル</span>
          </h2>
          <span id="capsule-count" class="text-xs text-slate-400">0件</span>
        </div>
        <div id="capsule-list" class="space-y-3"></div>
      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="absolute bottom-0 left-0 right-0 h-16 bg-[#0F172A] border-t border-slate-800/80 flex justify-around items-center px-4 z-10">
      <button id="nav-record" type="button" onclick="switchTab('record')" class="flex flex-col items-center space-y-1 text-[#A78BFA]">
        <i class="fa-solid fa-microphone text-lg"></i>
        <span class="text-[10px] font-medium">カプセル作成</span>
      </button>
      <button id="nav-history" type="button" onclick="switchTab('history')" class="flex flex-col items-center space-y-1 text-slate-400">
        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
        <span class="text-[10px] font-medium">蓄積履歴</span>
      </button>
    </div>

    <!-- Incoming Call Overlay Screen -->
    <div id="call-overlay" class="hidden absolute inset-0 bg-black z-50 p-6 flex flex-col justify-between items-center text-center">
      <div class="mt-8 space-y-3 w-full">
        <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-purple-400/50 flex items-center justify-center mx-auto shadow-2xl shadow-indigo-500/30 bg-slate-800">
          <img src="icon.png" alt="Caller Icon" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>';">
        </div>
        <div>
          <h3 id="call-sender-name" class="text-xl font-bold text-white">過去の自分</h3>
          <p id="call-status-text" class="text-xs text-[#A78BFA] mt-1 font-medium">未来からの着信...</p>
        </div>

        <!-- Speaker Output Toggle Button (Call Screen) -->
        <div id="speaker-toggle-container" class="hidden pt-2">
          <button id="speaker-toggle-btn" type="button" onclick="toggleGlobalSpeakerMode()" 
            class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-purple-300 text-xs font-semibold rounded-full border border-purple-500/40 inline-flex items-center space-x-2 shadow-md transition-all active:scale-95">
            <i id="call-speaker-icon" class="fa-solid fa-phone-volume text-sm"></i>
            <span id="call-speaker-text">受話器（耳あて）モード</span>
          </button>
        </div>
      </div>

      <!-- Reply Recording Area during Call -->
      <div id="reply-area" class="hidden w-full max-w-xs bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4 space-y-3 text-center my-auto shadow-xl">
        <div class="flex items-center justify-center space-x-1.5 text-xs text-purple-300 font-bold">
          <i class="fa-solid fa-reply text-xs"></i>
          <span>過去の自分へ返答を録音</span>
        </div>
        <p id="reply-status" class="text-[11px] text-slate-400">マイクボタンを押して返答を吹き込む</p>
        
        <div class="flex justify-center items-center space-x-3">
          <button id="reply-mic-btn" type="button" onclick="toggleReplyRecording()" 
            class="w-12 h-12 rounded-full bg-purple-600 text-white flex items-center justify-center shadow-md active:scale-95 transition-all">
            <i id="reply-mic-icon" class="fa-solid fa-microphone text-base"></i>
          </button>

          <button id="reply-play-btn" type="button" onclick="playReplyPreview()" class="hidden px-3 py-2 bg-slate-800 text-purple-300 text-xs font-medium rounded-xl flex items-center space-x-1.5 border border-purple-500/30">
            <i id="reply-play-icon" class="fa-solid fa-play text-xs"></i>
            <span id="reply-play-text">返答を確認</span>
          </button>
        </div>
      </div>

      <!-- Call Action Buttons -->
      <div class="mb-8 flex justify-center items-center space-x-12 w-full">
        <button id="end-call-btn" type="button" onclick="endCall()" class="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center shadow-lg shadow-red-500/40 active:scale-95 transition-all">
          <i class="fa-solid fa-phone-slash text-2xl"></i>
        </button>
        <button id="accept-call-btn" type="button" onclick="acceptCall()" class="w-16 h-16 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center shadow-lg shadow-emerald-500/40 animate-bounce active:scale-95 transition-all">
          <i class="fa-solid fa-phone text-2xl"></i>
        </button>
      </div>
    </div>

  </div>

  <script>
    let isRecording = false;
    let recordedAudioBlob = null;
    let audioUrl = null;
    let capsules = [];
    let callTimerInterval = null;
    let callSeconds = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentStream = null;

    let activeCallingCapsule = null;
    let ringtoneAudioCtx = null;
    let ringtoneOscillator = null;

    let isReplyRecording = false;
    let replyMediaRecorder = null;
    let replyAudioChunks = [];
    let replyAudioBlob = null;
    let replyAudioUrl = null;

    // Default Audio Mode: EARPIECE (通話受話器 / 耳あて)
    let isSpeakerMode = false;

    // Dynamic Audio Routing Control via Web Audio API & Native Bridge
    let activeAudioCtx = null;
    let activeAudioSource = null;
    let currentPlayingUrl = null;
    let currentOnEndedHandler = null;

    window.onload = () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 1);
      const localDatetime = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      const dateInput = document.getElementById('datetime-input');
      if (dateInput) dateInput.value = localDatetime;
      renderCapsules();
      updateSpeakerUI();
    };

    function toggleGlobalSpeakerMode() {
      isSpeakerMode = !isSpeakerMode;
      updateSpeakerUI();

      if (currentPlayingUrl) {
        applyCurrentAudioRoute();
      }
    }

    function updateSpeakerUI() {
      const globalBtn = document.getElementById('global-speaker-toggle-btn');
      const globalIcon = document.getElementById('global-speaker-icon');
      const globalText = document.getElementById('global-speaker-text');

      const bannerText = document.getElementById('banner-output-mode-text');
      const callText = document.getElementById('call-speaker-text');
      const callIcon = document.getElementById('call-speaker-icon');

      if (isSpeakerMode) {
        if (globalIcon) globalIcon.className = "fa-solid fa-volume-high text-xs text-amber-300";
        if (globalText) globalText.innerText = "本体スピーカー";
        if (globalBtn) globalBtn.className = "px-3 py-1 bg-amber-950/40 hover:bg-amber-900/50 border border-amber-500/50 rounded-full flex items-center space-x-1.5 transition-all cursor-pointer active:scale-95 shadow-sm";

        if (bannerText) bannerText.innerText = "再生出力を「本体スピーカー」に設定中";
        if (callText) callText.innerText = "本体スピーカーモード";
        if (callIcon) callIcon.className = "fa-solid fa-volume-high text-sm text-amber-300";
      } else {
        if (globalIcon) globalIcon.className = "fa-solid fa-phone-volume text-xs text-[#A78BFA]";
        if (globalText) globalText.innerText = "受話器（耳あて）";
        if (globalBtn) globalBtn.className = "px-3 py-1 bg-[#1E293B] hover:bg-slate-800 border border-purple-500/40 rounded-full flex items-center space-x-1.5 transition-all cursor-pointer active:scale-95 shadow-sm";

        if (bannerText) bannerText.innerText = "再生出力を「耳あて通話スピーカー」に設定中";
        if (callText) callText.innerText = "受話器（耳あて）モード";
        if (callIcon) callIcon.className = "fa-solid fa-phone-volume text-sm text-purple-300";
      }
    }

    function applyCurrentAudioRoute() {
      const mode = isSpeakerMode ? 'SPEAKER' : 'EARPIECE';
      setNativeAudioMode(mode);
    }

    function setNativeAudioMode(mode) {
      if (window.AudioToggle && typeof window.AudioToggle.setAudioMode === 'function') {
        try {
          if (mode === 'EARPIECE') {
            window.AudioToggle.setAudioMode(window.AudioToggle.EARPIECE);
            setTimeout(() => {
              try { window.AudioToggle.setAudioMode(window.AudioToggle.EARPIECE); } catch(e){}
            }, 100);
            setTimeout(() => {
              try { window.AudioToggle.setAudioMode(window.AudioToggle.EARPIECE); } catch(e){}
            }, 300);
          } else if (mode === 'SPEAKER') {
            window.AudioToggle.setAudioMode(window.AudioToggle.SPEAKER);
          } else {
            window.AudioToggle.setAudioMode(window.AudioToggle.NORMAL);
          }
        } catch (e) {
          console.warn("AudioToggle plugin error:", e);
        }
      }
    }

    function stopCurrentAudio() {
      if (activeAudioSource) {
        try { activeAudioSource.stop(); } catch(e){}
        activeAudioSource = null;
      }
      if (activeAudioCtx) {
        try { activeAudioCtx.close(); } catch(e){}
        activeAudioCtx = null;
      }
      currentPlayingUrl = null;
      setNativeAudioMode('NORMAL');

      if (currentOnEndedHandler) {
        const handler = currentOnEndedHandler;
        currentOnEndedHandler = null;
        handler();
      }
    }

    async function playAudioWithEarpieceRouting(url, onEnded) {
      if (currentPlayingUrl === url) {
        stopCurrentAudio();
        return;
      }

      stopCurrentAudio();
      currentPlayingUrl = url;
      currentOnEndedHandler = onEnded;

      applyCurrentAudioRoute();

      try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();

        activeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedData = await activeAudioCtx.decodeAudioData(arrayBuffer);

        activeAudioSource = activeAudioCtx.createBufferSource();
        activeAudioSource.buffer = decodedData;

        activeAudioSource.connect(activeAudioCtx.destination);

        applyCurrentAudioRoute();

        activeAudioSource.onended = () => {
          stopCurrentAudio();
        };

        activeAudioSource.start(0);

        setTimeout(() => applyCurrentAudioRoute(), 100);
        setTimeout(() => applyCurrentAudioRoute(), 250);

      } catch (err) {
        console.warn("Web Audio API routing fallback:", err);
        fallbackAudioPlay(url, onEnded);
      }
    }

    function fallbackAudioPlay(url, onEnded) {
      const fallbackAudio = new Audio(url);
      applyCurrentAudioRoute();
      fallbackAudio.play().then(() => {
        applyCurrentAudioRoute();
      }).catch(e => console.warn(e));

      fallbackAudio.onended = () => {
        currentPlayingUrl = null;
        setNativeAudioMode('NORMAL');
        if (onEnded) onEnded();
      };
    }

    function stopActiveStream() {
      if (currentStream) {
        try {
          currentStream.getTracks().forEach(track => track.stop());
        } catch(e) {
          console.warn("Track stop error:", e);
        }
        currentStream = null;
      }
    }

    async function getAudioStream() {
      const constraintsList = [
        { audio: true },
        { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } },
        { audio: { channelCount: 1 } },
        { audio: { sampleRate: 44100 } }
      ];

      let lastError = null;
      for (const constraints of constraintsList) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream && stream.getAudioTracks().length > 0) {
            return stream;
          }
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("マイクを起動できませんでした");
    }

    async function startOrStopRecording() {
      const micBtn = document.getElementById('mic-btn');
      const micIcon = document.getElementById('mic-icon');
      const micStatus = document.getElementById('mic-status');
      const previewBtn = document.getElementById('preview-btn');

      stopCurrentAudio();

      if (!isRecording) {
        micStatus.innerText = "マイクを起動中...";

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          micStatus.innerText = "お使いの環境はマイク録音に未対応です";
          alert("この端末環境ではマイク機能がサポートされていません。");
          return;
        }

        stopActiveStream();

        try {
          currentStream = await getAudioStream();
          audioChunks = [];

          let options = {};
          if (typeof MediaRecorder !== 'undefined') {
            if (MediaRecorder.isTypeSupported('audio/webm')) {
              options = { mimeType: 'audio/webm' };
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
              options = { mimeType: 'audio/mp4' };
            } else if (MediaRecorder.isTypeSupported('audio/aac')) {
              options = { mimeType: 'audio/aac' };
            }
          }

          mediaRecorder = new MediaRecorder(currentStream, options);

          mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = () => {
            const mimeType = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'audio/mp4';
            recordedAudioBlob = new Blob(audioChunks, { type: mimeType });
            audioUrl = URL.createObjectURL(recordedAudioBlob);
            if (previewBtn) previewBtn.classList.remove('hidden');
            enableSubmitButton();
            stopActiveStream();
          };

          mediaRecorder.start(100);
          isRecording = true;
          micBtn.className = "w-20 h-20 rounded-full bg-red-500 text-white flex items-center justify-center mx-auto pulse-animation cursor-pointer";
          micIcon.className = "fa-solid fa-square text-2xl";
          micStatus.innerText = "録音中... タップで停止";
        } catch (err) {
          console.error("録音起動エラー:", err);
          isRecording = false;
          stopActiveStream();
          
          micBtn.className = "w-20 h-20 rounded-full bg-[#7C3AED] text-white flex items-center justify-center mx-auto shadow-lg shadow-[#7C3AED]/40 active:scale-95 cursor-pointer";
          micIcon.className = "fa-solid fa-microphone text-2xl";

          micStatus.innerText = "エラー: " + (err.name || "マイクを開けません");
          alert("マイクの起動に失敗しました: " + (err.message || err.name));
        }
      } else {
        try {
          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
          }
        } catch (e) {
          console.error(e);
        }
        isRecording = false;
        micBtn.className = "w-20 h-20 rounded-full bg-[#7C3AED] text-white flex items-center justify-center mx-auto shadow-lg shadow-[#7C3AED]/40 active:scale-95 cursor-pointer";
        micIcon.className = "fa-solid fa-microphone text-2xl";
        micStatus.innerText = "録音完了！";
      }
    }

    function playPreview() {
      const previewIcon = document.getElementById('preview-icon');
      const previewText = document.getElementById('preview-text');
      const previewBtn = document.getElementById('preview-btn');

      if (!audioUrl) return;

      if (currentPlayingUrl === audioUrl) {
        stopCurrentAudio();
        previewIcon.className = "fa-solid fa-phone-volume text-sm text-purple-200";
        previewText.innerText = "通話スピーカーで録音を確認";
        previewBtn.classList.remove('playing-glow');
      } else {
        previewIcon.className = "fa-solid fa-pause text-sm text-red-300";
        previewText.innerText = isSpeakerMode ? "スピーカー再生中 (タップで停止)" : "耳あてで再生中 (タップで停止)";
        previewBtn.classList.add('playing-glow');

        playAudioWithEarpieceRouting(audioUrl, () => {
          previewIcon.className = "fa-solid fa-phone-volume text-sm text-purple-200";
          previewText.innerText = "通話スピーカーで録音を確認";
          previewBtn.classList.remove('playing-glow');
        });
      }
    }

    function enableSubmitButton() {
      const btn = document.getElementById('submit-btn');
      if (!btn) return;
      btn.disabled = false;
      btn.className = "w-full py-3 bg-[#7C3AED] hover:bg-[#6D28D9] text-white font-bold text-sm rounded-2xl flex items-center justify-center space-x-2 transition-all shadow-lg shadow-[#7C3AED]/30 cursor-pointer active:scale-95";
    }

    function saveCapsule() {
      const senderName = document.getElementById('sender-input').value.trim() || '過去の自分';
      const targetTimeVal = document.getElementById('datetime-input').value;
      if (!targetTimeVal || !audioUrl) return;

      const targetTime = new Date(targetTimeVal);
      const delayMs = targetTime.getTime() - Date.now();

      const capsule = {
        id: Date.now(),
        senderName: senderName,
        targetTime: targetTime,
        audioUrl: audioUrl,
        replyAudioUrl: null
      };

      capsules.push(capsule);
      renderCapsules();

      if (delayMs > 0) {
        setTimeout(() => triggerIncomingCall(capsule), delayMs);
      } else {
        setTimeout(() => triggerIncomingCall(capsule), 3000);
      }

      document.getElementById('preview-btn').classList.add('hidden');
      document.getElementById('mic-status').innerText = "マイクボタンを押して録音開始";
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.className = "w-full py-3 bg-slate-800 text-slate-500 font-bold text-sm rounded-2xl flex items-center justify-center space-x-2 transition-all";
      
      alert("タイムカプセルをセットしました！指定日時になると着信します。");
    }

    function renderCapsules() {
      const list = document.getElementById('capsule-list');
      const countEl = document.getElementById('capsule-count');
      if (!list) return;

      if (countEl) countEl.innerText = `${capsules.length}件`;

      if (capsules.length === 0) {
        list.innerHTML = `<div class="p-8 text-center bg-[#1E293B]/40 rounded-2xl border border-dashed border-slate-700/60">
          <i class="fa-solid fa-box-open text-2xl text-slate-500 mb-2"></i>
          <p class="text-xs text-slate-400">現在セットされているカプセルはありません。</p>
        </div>`;
        return;
      }

      list.innerHTML = capsules.map(c => `
        <div class="p-4 bg-[#1E293B] rounded-2xl border border-slate-700/60 space-y-3 shadow-md">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl overflow-hidden bg-slate-800 flex items-center justify-center text-white shadow-md border border-purple-500/30">
                <img src="icon.png" alt="Icon" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>';">
              </div>
              <div>
                <p class="text-sm font-bold text-white">${c.senderName}</p>
                <p class="text-xs text-slate-400">着信: ${c.targetTime.getFullYear()}/${c.targetTime.getMonth()+1}/${c.targetTime.getDate()} ${String(c.targetTime.getHours()).padStart(2,'0')}:${String(c.targetTime.getMinutes()).padStart(2,'0')}</p>
              </div>
            </div>
            <button type="button" onclick="deleteCapsule(${c.id})" class="text-slate-500 hover:text-red-400 p-2 transition-colors">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>

          <div class="flex items-center space-x-2 pt-2 border-t border-slate-800">
            <button type="button" onclick="playSavedAudio('${c.audioUrl}', this)" class="px-3 py-1.5 bg-[#4C1D95] hover:bg-[#5b21b6] text-white text-xs font-medium rounded-xl flex items-center space-x-1.5 border border-purple-500/30 transition-all">
              <i class="fa-solid fa-phone-volume text-[10px]"></i>
              <span>メッセージを聴く</span>
            </button>
            ${c.replyAudioUrl ? `
              <button type="button" onclick="playSavedAudio('${c.replyAudioUrl}', this)" class="px-3 py-1.5 bg-emerald-800 hover:bg-emerald-700 text-white text-xs font-medium rounded-xl flex items-center space-x-1.5 border border-emerald-500/30 transition-all">
                <i class="fa-solid fa-reply text-[10px]"></i>
                <span>当時の返答</span>
              </button>
            ` : '<span class="text-[10px] text-slate-500 bg-slate-800 px-2 py-1 rounded-lg">返答未記録</span>'}
          </div>
        </div>
      `).join('');
    }

    function playSavedAudio(url, btnElement) {
      if (!url) return;

      const icon = btnElement.querySelector('i');

      if (currentPlayingUrl === url) {
        stopCurrentAudio();
        if (icon) icon.className = "fa-solid fa-phone-volume text-[10px]";
        btnElement.classList.remove('playing-glow');
        return;
      }

      if (icon) icon.className = "fa-solid fa-pause text-[10px]";
      btnElement.classList.add('playing-glow');

      playAudioWithEarpieceRouting(url, () => {
        if (icon) icon.className = "fa-solid fa-phone-volume text-[10px]";
        btnElement.classList.remove('playing-glow');
      });
    }

    function deleteCapsule(id) {
      capsules = capsules.filter(c => c.id !== id);
      renderCapsules();
    }

    function startRingtone() {
      try {
        stopRingtone();
        setNativeAudioMode('SPEAKER');
        ringtoneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        ringtoneOscillator = ringtoneAudioCtx.createOscillator();
        const gainNode = ringtoneAudioCtx.createGain();

        ringtoneOscillator.type = 'sine';
        ringtoneOscillator.frequency.setValueAtTime(400, ringtoneAudioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, ringtoneAudioCtx.currentTime);

        ringtoneOscillator.connect(gainNode);
        gainNode.connect(ringtoneAudioCtx.destination);
        ringtoneOscillator.start();
      } catch(e) {
        console.warn("Ringtone error:", e);
      }
    }

    function stopRingtone() {
      if (ringtoneOscillator) {
        try { ringtoneOscillator.stop(); } catch(e){}
        ringtoneOscillator = null;
      }
      if (ringtoneAudioCtx) {
        try { ringtoneAudioCtx.close(); } catch(e){}
        ringtoneAudioCtx = null;
      }
    }

    function triggerIncomingCall(capsule) {
      activeCallingCapsule = capsule;
      replyAudioBlob = null;
      replyAudioUrl = null;

      document.getElementById('call-sender-name').innerText = capsule.senderName;
      document.getElementById('call-status-text').innerText = "未来からの着信...";
      document.getElementById('accept-call-btn').classList.remove('hidden');
      document.getElementById('reply-area').classList.add('hidden');
      document.getElementById('speaker-toggle-container').classList.add('hidden');
      document.getElementById('call-overlay').classList.remove('hidden');

      startRingtone();
    }

    function acceptCall() {
      stopRingtone();

      document.getElementById('accept-call-btn').classList.add('hidden');
      document.getElementById('reply-area').classList.remove('hidden');
      document.getElementById('speaker-toggle-container').classList.remove('hidden');
      document.getElementById('call-status-text').innerText = "通話中: 00:00";
      callSeconds = 0;
      clearInterval(callTimerInterval);
      
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const secs = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('call-status-text').innerText = `通話中: ${mins}:${secs}`;
      }, 1000);

      if (activeCallingCapsule && activeCallingCapsule.audioUrl) {
        playAudioWithEarpieceRouting(activeCallingCapsule.audioUrl, () => {
          document.getElementById('call-status-text').innerText = "通話中 (返答録音可能)";
        });
      }
    }

    async function toggleReplyRecording() {
      const micBtn = document.getElementById('reply-mic-btn');
      const micIcon = document.getElementById('reply-mic-icon');
      const replyStatus = document.getElementById('reply-status');
      const replyPlayBtn = document.getElementById('reply-play-btn');

      stopCurrentAudio();

      if (!isReplyRecording) {
        replyStatus.innerText = "マイク起動中...";
        stopActiveStream();

        try {
          currentStream = await getAudioStream();
          replyAudioChunks = [];

          let options = {};
          if (typeof MediaRecorder !== 'undefined') {
            if (MediaRecorder.isTypeSupported('audio/webm')) {
              options = { mimeType: 'audio/webm' };
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
              options = { mimeType: 'audio/mp4' };
            }
          }

          replyMediaRecorder = new MediaRecorder(currentStream, options);

          replyMediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
              replyAudioChunks.push(event.data);
            }
          };

          replyMediaRecorder.onstop = () => {
            const mimeType = (replyMediaRecorder && replyMediaRecorder.mimeType) ? replyMediaRecorder.mimeType : 'audio/mp4';
            replyAudioBlob = new Blob(replyAudioChunks, { type: mimeType });
            replyAudioUrl = URL.createObjectURL(replyAudioBlob);
            
            if (activeCallingCapsule) {
              activeCallingCapsule.replyAudioUrl = replyAudioUrl;
              renderCapsules();
            }

            replyPlayBtn.classList.remove('hidden');
            replyStatus.innerText = "返答を記録しました！";
            stopActiveStream();
          };

          replyMediaRecorder.start(100);
          isReplyRecording = true;
          micBtn.className = "w-12 h-12 rounded-full bg-red-500 text-white flex items-center justify-center shadow-md pulse-animation cursor-pointer";
          micIcon.className = "fa-solid fa-square text-base";
          replyStatus.innerText = "返答を録音中... タップで停止";
        } catch (err) {
          console.error("返答録音エラー:", err);
          isReplyRecording = false;
          stopActiveStream();
          replyStatus.innerText = "マイクの起動に失敗しました";
        }
      } else {
        try {
          if (replyMediaRecorder && replyMediaRecorder.state !== "inactive") {
            replyMediaRecorder.stop();
          }
        } catch (e) {
          console.error(e);
        }
        isReplyRecording = false;
        micBtn.className = "w-12 h-12 rounded-full bg-purple-600 text-white flex items-center justify-center shadow-md cursor-pointer";
        micIcon.className = "fa-solid fa-microphone text-base";
      }
    }

    function playReplyPreview() {
      const icon = document.getElementById('reply-play-icon');
      const text = document.getElementById('reply-play-text');

      if (!replyAudioUrl) return;

      if (currentPlayingUrl === replyAudioUrl) {
        stopCurrentAudio();
        icon.className = "fa-solid fa-play text-xs";
        text.innerText = "返答を確認";
      } else {
        icon.className = "fa-solid fa-pause text-xs";
        text.innerText = "再生中 (停止)";

        playAudioWithEarpieceRouting(replyAudioUrl, () => {
          icon.className = "fa-solid fa-play text-xs";
          text.innerText = "返答を確認";
        });
      }
    }

    function endCall() {
      stopRingtone();
      clearInterval(callTimerInterval);
      stopCurrentAudio();
      
      if (isReplyRecording && replyMediaRecorder) {
        try { replyMediaRecorder.stop(); } catch(e){}
      }
      stopActiveStream();

      setNativeAudioMode('NORMAL');

      document.getElementById('call-overlay').classList.add('hidden');
      activeCallingCapsule = null;
    }

    function switchTab(tab) {
      const screenRecord = document.getElementById('screen-record');
      const screenHistory = document.getElementById('screen-history');
      const navRecord = document.getElementById('nav-record');
      const navHistory = document.getElementById('nav-history');

      if (tab === 'record') {
        screenRecord.classList.remove('hidden');
        screenHistory.classList.add('hidden');
        navRecord.className = 'flex flex-col items-center space-y-1 text-[#A78BFA]';
        navHistory.className = 'flex flex-col items-center space-y-1 text-slate-400';
      } else {
        screenRecord.classList.add('hidden');
        screenHistory.classList.remove('hidden');
        navRecord.className = 'flex flex-col items-center space-y-1 text-slate-400';
        navHistory.className = 'flex flex-col items-center space-y-1 text-[#A78BFA]';
      }
    }
  </script>
</body>
</html>
