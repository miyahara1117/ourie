<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ourie TIME CAPSULE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-purple-500 selection:text-white">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 p-0.5 flex items-center justify-center shadow-inner">
        <img src="icon.png" onerror="this.src='https://via.placeholder.com/36'" class="w-full h-full rounded-full object-cover bg-slate-800" alt="App Icon">
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent">Ourie <span class="text-xs text-slate-400 font-normal">TIME CAPSULE</span></h1>
        <p class="text-[10px] text-slate-400">過去の自分</p>
      </div>
    </div>
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-full px-3 py-1 flex items-center space-x-1.5 shadow-sm">
      <i class="fa-solid fa-phone text-xs text-purple-400"></i>
      <span class="text-xs font-medium text-slate-300">受話器 (耳あて)</span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-md w-full mx-auto px-4 py-5 space-y-5 pb-24">

    <!-- 1. お届け先の選択 -->
    <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 shadow-sm">
      <h2 class="text-xs font-bold text-slate-400 mb-3 flex items-center space-x-1.5">
        <i class="fa-solid fa-paper-plane text-purple-400"></i>
        <span>お届け先の選択</span>
      </h2>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" class="py-2.5 px-3 rounded-xl bg-purple-600 text-white font-semibold text-xs flex items-center justify-center space-x-2 shadow-md transition-all">
          <i class="fa-solid fa-user"></i>
          <span>未来の自分へ</span>
        </button>
        <button type="button" class="py-2.5 px-3 rounded-xl bg-slate-800/80 text-slate-400 hover:text-slate-200 font-medium text-xs flex items-center justify-center space-x-2 transition-all">
          <i class="fa-solid fa-users"></i>
          <span>友達へ届ける</span>
        </button>
      </div>
    </section>

    <!-- 2. 録音セクション -->
    <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 shadow-sm text-center">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xs font-bold text-slate-400 flex items-center space-x-1.5">
          <i class="fa-solid fa-microphone text-purple-400"></i>
          <span>未来へ届ける声を録音</span>
        </h2>
        <span id="recording-timer" class="font-mono text-xs text-slate-400 bg-slate-800 px-2.5 py-0.5 rounded-full">00:00</span>
      </div>

      <!-- 録音ボタン -->
      <div class="my-3 flex justify-center">
        <button id="mic-btn" onclick="toggleRecording()" type="button" class="w-20 h-20 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 hover:from-purple-500 hover:to-indigo-400 text-white flex flex-col items-center justify-center shadow-lg shadow-purple-900/30 active:scale-95 transition-all">
          <i id="mic-icon" class="fa-solid fa-microphone text-2xl"></i>
        </button>
      </div>
      <p id="mic-status" class="text-xs font-medium text-slate-400 mt-2">タップして録音開始</p>

      <!-- 録音確認エリア (録音完了後に解放) -->
      <div id="preview-area" class="hidden mt-4 pt-4 border-t border-slate-800/80 space-y-3">
        <div class="flex items-center justify-between text-xs text-slate-300 px-1">
          <span class="flex items-center space-x-1.5 font-medium">
            <i class="fa-solid fa-headphones text-purple-400"></i>
            <span>録音音声の確認</span>
          </span>
          <span id="preview-duration" class="font-mono text-slate-400">00:00</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="playAudio(false)" type="button" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium flex items-center justify-center space-x-1.5 transition-all active:scale-95 border border-slate-700/50">
            <i class="fa-solid fa-phone text-purple-400"></i>
            <span>受話器で確認</span>
          </button>
          <button onclick="playAudio(true)" type="button" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium flex items-center justify-center space-x-1.5 transition-all active:scale-95 border border-slate-700/50">
            <i class="fa-solid fa-volume-high text-indigo-400"></i>
            <span>スピーカー確認</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 3. 日時選択 -->
    <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 shadow-sm space-y-3">
      <h2 class="text-xs font-bold text-slate-400 flex items-center space-x-1.5">
        <i class="fa-regular fa-clock text-purple-400"></i>
        <span>お届け日時 (着信日時)</span>
      </h2>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="setTimeOffset(10)" type="button" class="py-2 px-2 rounded-xl bg-slate-800 hover:bg-purple-950/40 hover:border-purple-500/50 border border-slate-700/60 text-slate-300 text-xs font-medium flex items-center justify-center space-x-1 transition-all">
          <i class="fa-solid fa-bolt text-yellow-400 text-[10px]"></i>
          <span>10秒後テスト</span>
        </button>
        <button onclick="setTimeOffset(60)" type="button" class="py-2 px-2 rounded-xl bg-slate-800 hover:bg-purple-950/40 hover:border-purple-500/50 border border-slate-700/60 text-slate-300 text-xs font-medium flex items-center justify-center space-x-1 transition-all">
          <i class="fa-solid fa-stopwatch text-purple-400 text-[10px]"></i>
          <span>1分後</span>
        </button>
        <button onclick="setTimeOffset(3600)" type="button" class="py-2 px-2 rounded-xl bg-slate-800 hover:bg-purple-950/40 hover:border-purple-500/50 border border-slate-700/60 text-slate-300 text-xs font-medium flex items-center justify-center space-x-1 transition-all">
          <i class="fa-regular fa-calendar-days text-indigo-400 text-[10px]"></i>
          <span>1時間後</span>
        </button>
      </div>
      <input type="datetime-local" id="target-time-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
    </section>

    <!-- 4. 送信（予約）ボタン -->
    <div class="pt-2">
      <button id="submit-btn" onclick="scheduleCapsule()" disabled type="button" class="w-full py-4 bg-slate-800 text-slate-500 font-bold text-sm rounded-xl flex items-center justify-center space-x-2 transition-all cursor-not-allowed shadow-md">
        <i class="fa-solid fa-paper-plane"></i>
        <span>未来の自分へタイムカプセルを予約する</span>
      </button>
    </div>

  </main>

  <!-- JavaScriptモジュール (完全一括定義) -->
  <script>
    // --- グローバル状態管理 ---
    let isRecording = false;
    let recTimer = null;
    let recSeconds = 0;
    let audioFilePath = "";
    let nativeRecorder = null;
    let nativePlayer = null;
    let webMediaRecorder = null;
    let webAudioChunks = [];
    let webAudioUrl = "";

    // 画面初期化
    document.addEventListener('DOMContentLoaded', () => {
      setTimeOffset(60);
    });

    // --- 日時入力補助 ---
    function setTimeOffset(seconds) {
      const now = new Date(Date.now() + seconds * 1000);
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('target-time-input').value = now.toISOString().slice(0, 16);
    }

    // --- 予約ボタン活性化関数 (無条件強制切り替え) ---
    function setSubmitButtonState(enabled) {
      const btn = document.getElementById('submit-btn');
      if (!btn) return;

      if (enabled) {
        btn.removeAttribute('disabled');
        btn.disabled = false;
        btn.className = "w-full py-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-sm rounded-xl flex items-center justify-center space-x-2 transition-all shadow-lg active:scale-98 cursor-pointer";
      } else {
        btn.setAttribute('disabled', 'true');
        btn.disabled = true;
        btn.className = "w-full py-4 bg-slate-800 text-slate-500 font-bold text-sm rounded-xl flex items-center justify-center space-x-2 transition-all cursor-not-allowed shadow-md";
      }
    }

    // --- 録音制御 (Native Media 優先 / Web MediaRecorder フォールバック) ---
    async function toggleRecording() {
      const micBtn = document.getElementById('mic-btn');
      const micIcon = document.getElementById('mic-icon');
      const micStatus = document.getElementById('mic-status');

      if (!isRecording) {
        // ▼ 録音開始
        try {
          audioFilePath = "ourie_capsule_" + Date.now() + ".m4a";

          if (window.Media) {
            // Native Plugin 録音
            nativeRecorder = new Media(audioFilePath, () => {}, (err) => console.error(err));
            nativeRecorder.startRecord();
          } else {
            // Web 録音 (ブラウザ用)
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            webAudioChunks = [];
            webMediaRecorder = new MediaRecorder(stream);
            webMediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) webAudioChunks.push(e.data); };
            webMediaRecorder.start();
          }

          isRecording = true;
          micBtn.className = "w-20 h-20 rounded-full bg-red-600 hover:bg-red-500 text-white flex flex-col items-center justify-center shadow-lg shadow-red-900/40 active:scale-95 transition-all animate-pulse";
          micIcon.className = "fa-solid fa-square text-2xl";
          micStatus.innerText = "録音中... タップで停止";

          recSeconds = 0;
          recTimer = setInterval(() => {
            recSeconds++;
            const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
            const s = String(recSeconds % 60).padStart(2, '0');
            document.getElementById('recording-timer').innerText = `${m}:${s}`;
          }, 1000);

        } catch (e) {
          console.error("Mic start failed:", e);
          micStatus.innerText = "マイクの使用が許可されていません";
        }
      } else {
        // ▼ 録音停止 (待ち時間ゼロで画面を解放)
        isRecording = false;
        clearInterval(recTimer);

        micBtn.className = "w-20 h-20 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 text-white flex flex-col items-center justify-center shadow-lg shadow-purple-900/30 active:scale-95 transition-all";
        micIcon.className = "fa-solid fa-microphone text-2xl";
        micStatus.innerText = "録音完了！";

        if (nativeRecorder) {
          try { nativeRecorder.stopRecord(); nativeRecorder.release(); } catch(e) {}
        } else if (webMediaRecorder) {
          try {
            webMediaRecorder.stop();
            webMediaRecorder.onstop = () => {
              const blob = new Blob(webAudioChunks, { type: 'audio/aac' });
              webAudioUrl = URL.createObjectURL(blob);
            };
          } catch(e) {}
        }

        // 時間の同期と確認エリア表示
        const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
        const s = String(recSeconds % 60).padStart(2, '0');
        document.getElementById('preview-duration').innerText = `${m}:${s}`;
        document.getElementById('preview-area').classList.remove('hidden');

        // ★ 予約ボタンを最優先で即時有効化
        setSubmitButtonState(true);
      }
    }

    // --- 音声再生制御 (受話器/スピーカー強制ルーティング) ---
    function playAudio(forceSpeaker) {
      if (nativePlayer) {
        try { nativePlayer.stop(); nativePlayer.release(); } catch(e) {}
      }

      // 1. AudioToggle プラグインで受話器(earpiece) / スピーカー(speaker) をハード制御
      const toggle = window.AudioToggle || (window.cordova && window.cordova.plugins && window.cordova.plugins.AudioToggle);
      if (toggle && typeof toggle.setAudioMode === 'function') {
        toggle.setAudioMode(forceSpeaker ? "speaker" : "earpiece");
      }

      // 2. 音声再生処理
      if (window.Media && audioFilePath) {
        nativePlayer = new Media(audioFilePath,
          () => {
            if (toggle && typeof toggle.setAudioMode === 'function') toggle.setAudioMode("speaker");
          },
          (err) => console.error("Play error:", err)
        );
        nativePlayer.play();
      } else if (webAudioUrl) {
        const audio = new Audio(webAudioUrl);
        audio.onended = () => {
          if (toggle && typeof toggle.setAudioMode === 'function') toggle.setAudioMode("speaker");
        };
        audio.play();
      }
    }

    // --- タイムカプセル予約実行 ---
    function scheduleCapsule() {
      alert("タイムカプセルを予約しました！設定した日時に着信が届きます。");
    }
  </script>
</body>
</html>
