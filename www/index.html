<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ourie</title>
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <!-- Chosen Palette: Mint Teal & Cream Warm Theme -->
  <!-- Application Structure Plan: Interactive time capsule audio app styled with Mint Teal & Warm Gold accents matching the Ourie app icon. Supports seamless earpiece receiver routing for all previews, replies, and saved capsules. -->
  <!-- Visualization & Content Choices: Clean responsive mobile app UI with HTML5 Audio & AudioToggle integration for earpiece routing. CONFIRMING: NO SVG, NO Mermaid JS. -->
  <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0d1514;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .pulse-animation {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

  <div class="relative w-full max-w-[390px] h-[844px] bg-[#121d1b] sm:rounded-[40px] shadow-2xl border-0 sm:border-8 border-slate-800 overflow-hidden flex flex-col justify-between">
    
    <!-- アプリコンテンツ領域 -->
    <div id="app-content" class="flex-1 overflow-y-auto p-5 pb-20">
      
      <!-- 【画面1】カプセル作成 -->
      <div id="screen-record" class="block space-y-5">
        <!-- ヘッダー -->
        <div class="flex items-center space-x-3">
          <img src="icon.jpg" alt="Ourie Logo" class="w-10 h-10 rounded-2xl object-cover border border-[#48BB96]/40 shadow-md" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%2348BB96\'/><text x=\'50\' y=\'60\' font-size=\'40\' fill=\'white\' text-anchor=\'middle\'>O</text></svg>'">
          <div>
            <h1 class="text-xl font-bold tracking-wide text-white">Ourie</h1>
            <p class="text-[10px] text-[#82D6BB]">時を越える音声タイムカプセル</p>
          </div>
        </div>

        <!-- 説明バナー -->
        <div class="p-4 rounded-2xl bg-gradient-to-r from-[#1b332d] to-[#162623] border border-[#48BB96]/30 space-y-1.5">
          <div class="flex items-center space-x-2 text-[#82D6BB] text-xs font-bold">
            <i class="fa-solid fa-phone-volume"></i>
            <span>通話スピーカー（受話器）から届く声</span>
          </div>
          <p class="text-xs text-slate-300 leading-relaxed">
            指定の日時になると過去の自分から「電話」が着信。プレビューや歴史の再生もすべてスマホ上部の耳あて受話器から聴くことができます。
          </p>
        </div>

        <!-- 発信者名入力 -->
        <div class="space-y-1.5">
          <label class="text-xs text-slate-300">着信時の発信者名</label>
          <input id="sender-input" type="text" value="過去の自分" placeholder="例: 1年前の自分、ハタチの俺" 
            class="w-full bg-[#1A2A27] text-sm text-white px-4 py-3 rounded-2xl border border-slate-700/60 focus:outline-none focus:border-[#48BB96]">
        </div>

        <!-- 録音カード -->
        <div class="p-6 bg-[#1A2A27] rounded-3xl border border-slate-700/60 text-center space-y-3 shadow-lg">
          <button id="mic-btn" type="button" onclick="startOrStopRecording()" 
            class="w-20 h-20 rounded-full bg-gradient-to-tr from-[#3FA886] to-[#51C4A2] text-white flex items-center justify-center mx-auto transition-all shadow-lg shadow-[#48BB96]/30 active:scale-95 cursor-pointer">
            <i id="mic-icon" class="fa-solid fa-microphone text-2xl"></i>
          </button>
          <p id="mic-status" class="text-xs text-slate-300 leading-normal">マイクボタンを押して録音開始</p>

          <button id="preview-btn" type="button" onclick="playPreview()" class="hidden mx-auto px-4 py-2 bg-[#204239] hover:bg-[#285247] text-[#82D6BB] text-xs font-semibold rounded-xl flex items-center space-x-2 border border-[#48BB96]/30">
            <i id="preview-icon" class="fa-solid fa-play"></i>
            <span id="preview-text">受話器で確認再生</span>
          </button>
        </div>

        <!-- 日時指定 -->
        <div class="space-y-1.5">
          <label class="text-xs text-slate-300">お届け日時を指定（未来の着信日時）</label>
          <input id="datetime-input" type="datetime-local" 
            class="w-full bg-[#1A2A27] text-sm text-white px-4 py-3 rounded-2xl border border-slate-700/60 focus:outline-none focus:border-[#48BB96]">
        </div>

        <!-- 送信ボタン -->
        <button id="submit-btn" type="button" disabled onclick="saveCapsule()" 
          class="w-full py-3.5 bg-slate-800 text-slate-500 font-bold text-sm rounded-2xl flex items-center justify-center space-x-2 transition-all">
          <i class="fa-solid fa-paper-plane text-xs"></i>
          <span id="submit-text">未来へカプセルを封印する</span>
        </button>
      </div>

      <!-- 【画面2】蓄積履歴 -->
      <div id="screen-history" class="hidden space-y-4">
        <h2 class="text-base font-bold text-white flex items-center space-x-2">
          <i class="fa-solid fa-box-archive text-[#48BB96]"></i>
          <span>蓄積履歴 & 封印カプセル</span>
        </h2>
        <div id="capsule-list" class="space-y-3"></div>
      </div>

    </div>

    <!-- ボトムナビゲーション -->
    <div class="absolute bottom-0 left-0 right-0 h-16 bg-[#0D1514] border-t border-slate-800/80 flex justify-around items-center px-4">
      <button id="nav-record" type="button" onclick="switchTab('record')" class="flex flex-col items-center space-y-1 text-[#48BB96]">
        <i class="fa-solid fa-microphone text-lg"></i>
        <span class="text-[10px] font-medium">カプセル作成</span>
      </button>
      <button id="nav-history" type="button" onclick="switchTab('history')" class="flex flex-col items-center space-y-1 text-slate-500">
        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
        <span class="text-[10px] font-medium">蓄積履歴</span>
      </button>
    </div>

    <!-- 【オーバーレイ】着信画面 -->
    <div id="call-overlay" class="hidden absolute inset-0 bg-black z-50 p-6 flex flex-col justify-between items-center text-center">
      <div class="mt-8 space-y-3 w-full">
        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-[#3FA886] to-[#51C4A2] flex items-center justify-center mx-auto shadow-2xl shadow-emerald-500/30">
          <i class="fa-solid fa-user text-3xl text-white"></i>
        </div>
        <div>
          <h3 id="call-sender-name" class="text-xl font-bold text-white">過去の自分</h3>
          <p id="call-status-text" class="text-xs text-[#82D6BB] mt-1 font-medium">Ourie からの着信...</p>
        </div>

        <div id="speaker-toggle-container" class="hidden pt-2">
          <button id="speaker-toggle-btn" type="button" onclick="toggleSpeakerOutput()" 
            class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-[#82D6BB] text-xs rounded-full border border-[#48BB96]/30 inline-flex items-center space-x-2">
            <i id="speaker-toggle-icon" class="fa-solid fa-phone-volume"></i>
            <span id="speaker-toggle-text">受話器モード中</span>
          </button>
        </div>
      </div>

      <!-- 返答録音エリア -->
      <div id="reply-area" class="hidden w-full max-w-xs bg-[#162623]/90 border border-[#48BB96]/40 rounded-2xl p-4 space-y-3 text-center my-auto">
        <div class="flex items-center justify-center space-x-1.5 text-xs text-[#82D6BB] font-bold">
          <i class="fa-solid fa-reply text-xs"></i>
          <span>過去の自分へ返答を録音</span>
        </div>
        <p id="reply-status" class="text-[11px] text-slate-400">マイクボタンを押して返答を吹き込む</p>
        
        <div class="flex justify-center items-center space-x-3">
          <button id="reply-mic-btn" type="button" onclick="toggleReplyRecording()" 
            class="w-12 h-12 rounded-full bg-[#48BB96] text-white flex items-center justify-center shadow-md active:scale-95 transition-all">
            <i id="reply-mic-icon" class="fa-solid fa-microphone text-base"></i>
          </button>

          <button id="reply-play-btn" type="button" onclick="playReplyPreview()" class="hidden px-3 py-2 bg-slate-800 text-[#82D6BB] text-xs rounded-xl flex items-center space-x-1 border border-[#48BB96]/30">
            <i id="reply-play-icon" class="fa-solid fa-play text-xs"></i>
            <span id="reply-play-text">受話器で確認</span>
          </button>
        </div>
      </div>

      <div class="mb-8 flex justify-center items-center space-x-12 w-full">
        <button id="end-call-btn" type="button" onclick="endCall()" class="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center shadow-lg shadow-red-500/40">
          <i class="fa-solid fa-phone-slash text-2xl"></i>
        </button>
        <button id="accept-call-btn" type="button" onclick="acceptCall()" class="w-16 h-16 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center shadow-lg shadow-emerald-500/40 animate-bounce">
          <i class="fa-solid fa-phone text-2xl"></i>
        </button>
      </div>
    </div>

  </div>

  <script>
    let isRecording = false;
    let recordedAudioBlob = null;
    let audioUrl = null;
    let audioPlayer = new Audio();
    let replyPlayer = new Audio();
    let capsules = [];
    let callTimerInterval = null;
    let callSeconds = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentStream = null;

    let activeCallingCapsule = null;
    let ringtoneAudioCtx = null;
    let ringtoneOscillator = null;

    let isReplyRecording = false;
    let replyMediaRecorder = null;
    let replyAudioChunks = [];
    let replyAudioBlob = null;
    let replyAudioUrl = null;

    let isLoudspeaker = false;

    window.onload = () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 1);
      const localDatetime = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      const dateInput = document.getElementById('datetime-input');
      if (dateInput) dateInput.value = localDatetime;
      renderCapsules();
    };

    function setNativeAudioMode(mode) {
      if (window.AudioToggle && typeof window.AudioToggle.setAudioMode === 'function') {
        try {
          if (mode === 'EARPIECE') {
            window.AudioToggle.setAudioMode(window.AudioToggle.EARPIECE);
          } else if (mode === 'SPEAKER') {
            window.AudioToggle.setAudioMode(window.AudioToggle.SPEAKER);
          } else {
            window.AudioToggle.setAudioMode(window.AudioToggle.NORMAL);
          }
        } catch (e) {
          console.warn("AudioToggle error:", e);
        }
      }
    }

    function stopActiveStream() {
      if (currentStream) {
        try {
          currentStream.getTracks().forEach(track => track.stop());
        } catch(e) {
          console.warn("Track stop error:", e);
        }
        currentStream = null;
      }
    }

    async function getAudioStream() {
      const constraintsList = [
        { audio: true },
        { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } },
        { audio: { channelCount: 1 } },
        { audio: { sampleRate: 44100 } }
      ];

      let lastError = null;
      for (const constraints of constraintsList) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream && stream.getAudioTracks().length > 0) {
            return stream;
          }
        } catch (err) {
          lastError = err;
          console.warn("Constraint failed, trying next:", constraints, err);
        }
      }
      throw lastError || new Error("マイクを起動できませんでした");
    }

    async function startOrStopRecording() {
      const micBtn = document.getElementById('mic-btn');
      const micIcon = document.getElementById('mic-icon');
      const micStatus = document.getElementById('mic-status');
      const previewBtn = document.getElementById('preview-btn');

      if (!isRecording) {
        micStatus.innerText = "マイクを起動中...";

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          micStatus.innerText = "お使いの環境はマイク録音に未対応です";
          alert("この端末環境ではマイク機能がサポートされていません。");
          return;
        }

        stopActiveStream();

        try {
          currentStream = await getAudioStream();
          audioChunks = [];

          let options = {};
          if (typeof MediaRecorder !== 'undefined') {
            if (MediaRecorder.isTypeSupported('audio/webm')) {
              options = { mimeType: 'audio/webm' };
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
              options = { mimeType: 'audio/mp4' };
            } else if (MediaRecorder.isTypeSupported('audio/aac')) {
              options = { mimeType: 'audio/aac' };
            }
          }

          mediaRecorder = new MediaRecorder(currentStream, options);

          mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = () => {
            const mimeType = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'audio/mp4';
            recordedAudioBlob = new Blob(audioChunks, { type: mimeType });
            audioUrl = URL.createObjectURL(recordedAudioBlob);
            if (previewBtn) previewBtn.classList.remove('hidden');
            enableSubmitButton();
            stopActiveStream();
          };

          mediaRecorder.start(100);
          isRecording = true;
          micBtn.className = "w-20 h-20 rounded-full bg-red-500 text-white flex items-center justify-center mx-auto pulse-animation cursor-pointer";
          micIcon.className = "fa-solid fa-square text-2xl";
          micStatus.innerText = "録音中... タップで停止";
        } catch (err) {
          console.error("録音起動エラー:", err);
          isRecording = false;
          stopActiveStream();
          
          micBtn.className = "w-20 h-20 rounded-full bg-gradient-to-tr from-[#3FA886] to-[#51C4A2] text-white flex items-center justify-center mx-auto shadow-lg shadow-[#48BB96]/30 active:scale-95 cursor-pointer";
          micIcon.className = "fa-solid fa-microphone text-2xl";

          micStatus.innerText = "エラー: " + (err.name || "マイクを開けません");
          alert("マイクの起動に失敗しました: " + (err.message || err.name));
        }
      } else {
        try {
          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
          }
        } catch (e) {
          console.error(e);
        }
        isRecording = false;
        micBtn.className = "w-20 h-20 rounded-full bg-gradient-to-tr from-[#3FA886] to-[#51C4A2] text-white flex items-center justify-center mx-auto shadow-lg shadow-[#48BB96]/30 active:scale-95 cursor-pointer";
        micIcon.className = "fa-solid fa-microphone text-2xl";
        micStatus.innerText = "録音完了！";
      }
    }

    function playPreview() {
      const previewIcon = document.getElementById('preview-icon');
      const previewText = document.getElementById('preview-text');

      if (!audioPlayer.paused) {
        audioPlayer.pause();
        previewIcon.className = "fa-solid fa-play";
        previewText.innerText = "受話器で確認再生";
        setNativeAudioMode('NORMAL');
      } else if (audioUrl) {
        setNativeAudioMode('EARPIECE');
        audioPlayer.src = audioUrl;
        audioPlayer.play().catch(e => console.warn(e));
        previewIcon.className = "fa-solid fa-pause";
        previewText.innerText = "停止";
        audioPlayer.onended = () => {
          previewIcon.className = "fa-solid fa-play";
          previewText.innerText = "受話器で確認再生";
          setNativeAudioMode('NORMAL');
        };
      }
    }

    function enableSubmitButton() {
      const btn = document.getElementById('submit-btn');
      if (!btn) return;
      btn.disabled = false;
      btn.className = "w-full py-3.5 bg-gradient-to-r from-[#3FA886] to-[#51C4A2] text-white font-bold text-sm rounded-2xl flex items-center justify-center space-x-2 transition-all shadow-lg shadow-[#48BB96]/30 active:scale-[0.98]";
    }

    function saveCapsule() {
      const senderName = document.getElementById('sender-input').value.trim() || '過去の自分';
      const targetTimeVal = document.getElementById('datetime-input').value;
      if (!targetTimeVal || !audioUrl) return;

      const targetTime = new Date(targetTimeVal);
      const delayMs = targetTime.getTime() - Date.now();

      const capsule = {
        id: Date.now(),
        senderName: senderName,
        targetTime: targetTime,
        audioUrl: audioUrl,
        replyAudioUrl: null
      };

      capsules.push(capsule);
      renderCapsules();

      if (delayMs > 0) {
        setTimeout(() => triggerIncomingCall(capsule), delayMs);
      } else {
        setTimeout(() => triggerIncomingCall(capsule), 3000);
      }

      document.getElementById('preview-btn').classList.add('hidden');
      document.getElementById('mic-status').innerText = "マイクボタンを押して録音開始";
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.className = "w-full py-3.5 bg-slate-800 text-slate-500 font-bold text-sm rounded-2xl flex items-center justify-center space-x-2 transition-all";
      
      alert("Ourie タイムカプセルを封印しました！指定の日時になると着信します。");
    }

    function renderCapsules() {
      const list = document.getElementById('capsule-list');
      if (!list) return;
      if (capsules.length === 0) {
        list.innerHTML = `<p class="text-center text-xs text-slate-500 py-8">現在封印中のカプセルはありません。</p>`;
        return;
      }

      list.innerHTML = capsules.map(c => `
        <div class="p-4 bg-[#1A2A27] rounded-2xl border border-slate-700/60 space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-[#204239] flex items-center justify-center text-[#48BB96]">
                <i class="fa-solid fa-envelope text-sm"></i>
              </div>
              <div>
                <p class="text-sm font-bold text-white">${c.senderName}</p>
                <p class="text-xs text-slate-400">着信: ${c.targetTime.getFullYear()}/${c.targetTime.getMonth()+1}/${c.targetTime.getDate()} ${String(c.targetTime.getHours()).padStart(2,'0')}:${String(c.targetTime.getMinutes()).padStart(2,'0')}</p>
              </div>
            </div>
            <button type="button" onclick="deleteCapsule(${c.id})" class="text-slate-500 hover:text-red-400 p-2">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>

          <div class="flex items-center space-x-2 pt-1 border-t border-slate-800">
            <button type="button" onclick="playSavedAudio('${c.audioUrl}', this)" class="px-3 py-1.5 bg-[#204239] text-[#82D6BB] text-xs rounded-xl flex items-center space-x-1.5 border border-[#48BB96]/30">
              <i class="fa-solid fa-play text-[10px]"></i>
              <span>受話器で聴く</span>
            </button>
            ${c.replyAudioUrl ? `
              <button type="button" onclick="playSavedAudio('${c.replyAudioUrl}', this)" class="px-3 py-1.5 bg-emerald-800 text-emerald-200 text-xs rounded-xl flex items-center space-x-1.5">
                <i class="fa-solid fa-play text-[10px]"></i>
                <span>当時の返答を聴く</span>
              </button>
            ` : '<span class="text-[10px] text-slate-500">返答なし</span>'}
          </div>
        </div>
      `).join('');
    }

    function playSavedAudio(url, btnElement) {
      if (!url) return;

      if (audioPlayer.src === url && !audioPlayer.paused) {
        audioPlayer.pause();
        setNativeAudioMode('NORMAL');
        if (btnElement && btnElement.querySelector('i')) {
          btnElement.querySelector('i').className = "fa-solid fa-play text-[10px]";
        }
        return;
      }

      setNativeAudioMode('EARPIECE');
      audioPlayer.src = url;
      audioPlayer.play().catch(e => console.warn(e));

      if (btnElement && btnElement.querySelector('i')) {
        btnElement.querySelector('i').className = "fa-solid fa-pause text-[10px]";
      }

      audioPlayer.onended = () => {
        setNativeAudioMode('NORMAL');
        if (btnElement && btnElement.querySelector('i')) {
          btnElement.querySelector('i').className = "fa-solid fa-play text-[10px]";
        }
      };
    }

    function deleteCapsule(id) {
      capsules = capsules.filter(c => c.id !== id);
      renderCapsules();
    }

    function startRingtone() {
      try {
        stopRingtone();
        setNativeAudioMode('SPEAKER');
        ringtoneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        ringtoneOscillator = ringtoneAudioCtx.createOscillator();
        const gainNode = ringtoneAudioCtx.createGain();

        ringtoneOscillator.type = 'sine';
        ringtoneOscillator.frequency.setValueAtTime(400, ringtoneAudioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, ringtoneAudioCtx.currentTime);

        ringtoneOscillator.connect(gainNode);
        gainNode.connect(ringtoneAudioCtx.destination);
        ringtoneOscillator.start();
      } catch(e) {
        console.warn("Ringtone error:", e);
      }
    }

    function stopRingtone() {
      if (ringtoneOscillator) {
        try { ringtoneOscillator.stop(); } catch(e){}
        ringtoneOscillator = null;
      }
      if (ringtoneAudioCtx) {
        try { ringtoneAudioCtx.close(); } catch(e){}
        ringtoneAudioCtx = null;
      }
    }

    function triggerIncomingCall(capsule) {
      activeCallingCapsule = capsule;
      replyAudioBlob = null;
      replyAudioUrl = null;

      document.getElementById('call-sender-name').innerText = capsule.senderName;
      document.getElementById('call-status-text').innerText = "Ourie 未来からの着信...";
      document.getElementById('accept-call-btn').classList.remove('hidden');
      document.getElementById('reply-area').classList.add('hidden');
      document.getElementById('speaker-toggle-container').classList.add('hidden');
      document.getElementById('call-overlay').classList.remove('hidden');

      startRingtone();
    }

    function toggleSpeakerOutput() {
      isLoudspeaker = !isLoudspeaker;
      const text = document.getElementById('speaker-toggle-text');
      const icon = document.getElementById('speaker-toggle-icon');

      if (isLoudspeaker) {
        text.innerText = "本体スピーカーモード中";
        icon.className = "fa-solid fa-volume-high";
        setNativeAudioMode('SPEAKER');
      } else {
        text.innerText = "受話器モード中";
        icon.className = "fa-solid fa-phone-volume";
        setNativeAudioMode('EARPIECE');
      }
    }

    function acceptCall() {
      stopRingtone();

      isLoudspeaker = false;
      setNativeAudioMode('EARPIECE');

      document.getElementById('accept-call-btn').classList.add('hidden');
      document.getElementById('reply-area').classList.remove('hidden');
      document.getElementById('speaker-toggle-container').classList.remove('hidden');
      document.getElementById('speaker-toggle-text').innerText = "受話器モード中";
      document.getElementById('speaker-toggle-icon').className = "fa-solid fa-phone-volume";
      document.getElementById('call-status-text').innerText = "通話中: 00:00";
      callSeconds = 0;
      clearInterval(callTimerInterval);
      
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const secs = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('call-status-text').innerText = `通話中: ${mins}:${secs}`;
      }, 1000);

      if (activeCallingCapsule && activeCallingCapsule.audioUrl) {
        audioPlayer.src = activeCallingCapsule.audioUrl;
        audioPlayer.play().catch(e => {
          console.warn("Audio play error:", e);
        });

        audioPlayer.onended = () => {
          document.getElementById('call-status-text').innerText = "通話中 (返答録音可能)";
        };
      }
    }

    async function toggleReplyRecording() {
      const micBtn = document.getElementById('reply-mic-btn');
      const micIcon = document.getElementById('reply-mic-icon');
      const replyStatus = document.getElementById('reply-status');
      const replyPlayBtn = document.getElementById('reply-play-btn');

      if (!isReplyRecording) {
        replyStatus.innerText = "マイク起動中...";
        stopActiveStream();

        try {
          currentStream = await getAudioStream();
          replyAudioChunks = [];

          let options = {};
          if (typeof MediaRecorder !== 'undefined') {
            if (MediaRecorder.isTypeSupported('audio/webm')) {
              options = { mimeType: 'audio/webm' };
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
              options = { mimeType: 'audio/mp4' };
            }
          }

          replyMediaRecorder = new MediaRecorder(currentStream, options);

          replyMediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
              replyAudioChunks.push(event.data);
            }
          };

          replyMediaRecorder.onstop = () => {
            const mimeType = (replyMediaRecorder && replyMediaRecorder.mimeType) ? replyMediaRecorder.mimeType : 'audio/mp4';
            replyAudioBlob = new Blob(replyAudioChunks, { type: mimeType });
            replyAudioUrl = URL.createObjectURL(replyAudioBlob);
            
            if (activeCallingCapsule) {
              activeCallingCapsule.replyAudioUrl = replyAudioUrl;
              renderCapsules();
            }

            replyPlayBtn.classList.remove('hidden');
            replyStatus.innerText = "返答を記録しました！";
            stopActiveStream();
          };

          replyMediaRecorder.start(100);
          isReplyRecording = true;
          micBtn.className = "w-12 h-12 rounded-full bg-red-500 text-white flex items-center justify-center shadow-md pulse-animation cursor-pointer";
          micIcon.className = "fa-solid fa-square text-base";
          replyStatus.innerText = "返答を録音中... タップで停止";
        } catch (err) {
          console.error("返答録音エラー:", err);
          isReplyRecording = false;
          stopActiveStream();
          replyStatus.innerText = "マイクの起動に失敗しました";
        }
      } else {
        try {
          if (replyMediaRecorder && replyMediaRecorder.state !== "inactive") {
            replyMediaRecorder.stop();
          }
        } catch (e) {
          console.error(e);
        }
        isReplyRecording = false;
        micBtn.className = "w-12 h-12 rounded-full bg-[#48BB96] text-white flex items-center justify-center shadow-md cursor-pointer";
        micIcon.className = "fa-solid fa-microphone text-base";
      }
    }

    function playReplyPreview() {
      const icon = document.getElementById('reply-play-icon');
      const text = document.getElementById('reply-play-text');

      if (!replyPlayer.paused) {
        replyPlayer.pause();
        icon.className = "fa-solid fa-play text-xs";
        text.innerText = "受話器で確認";
        if (!isLoudspeaker) {
          setNativeAudioMode('NORMAL');
        }
      } else if (replyAudioUrl) {
        if (!isLoudspeaker) {
          setNativeAudioMode('EARPIECE');
        }
        replyPlayer.src = replyAudioUrl;
        replyPlayer.play().catch(e => console.warn(e));
        icon.className = "fa-solid fa-pause text-xs";
        text.innerText = "停止";
        replyPlayer.onended = () => {
          icon.className = "fa-solid fa-play text-xs";
          text.innerText = "受話器で確認";
          if (!isLoudspeaker) {
            setNativeAudioMode('NORMAL');
          }
        };
      }
    }

    function endCall() {
      stopRingtone();
      clearInterval(callTimerInterval);
      audioPlayer.pause();
      replyPlayer.pause();
      
      if (isReplyRecording && replyMediaRecorder) {
        try { replyMediaRecorder.stop(); } catch(e){}
      }
      stopActiveStream();

      setNativeAudioMode('NORMAL');

      document.getElementById('call-overlay').classList.add('hidden');
      activeCallingCapsule = null;
    }

    function switchTab(tab) {
      const screenRecord = document.getElementById('screen-record');
      const screenHistory = document.getElementById('screen-history');
      const navRecord = document.getElementById('nav-record');
      const navHistory = document.getElementById('nav-history');

      if (tab === 'record') {
        screenRecord.classList.remove('hidden');
        screenHistory.classList.add('hidden');
        navRecord.className = 'flex flex-col items-center space-y-1 text-[#48BB96]';
        navHistory.className = 'flex flex-col items-center space-y-1 text-slate-500';
      } else {
        screenRecord.classList.add('hidden');
        screenHistory.classList.remove('hidden');
        navRecord.className = 'flex flex-col items-center space-y-1 text-slate-500';
        navHistory.className = 'flex flex-col items-center space-y-1 text-[#48BB96]';
      }
    }
  </script>
</body>
</html>
