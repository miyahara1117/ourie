<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ourie TIME CAPSULE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

  <style>
    body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-purple-500 selection:text-white pb-20">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-sm">
    <div onclick="editMyProfile()" class="flex items-center space-x-3 cursor-pointer hover:opacity-80 transition-opacity">
      <div class="relative w-9 h-9 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 p-0.5 flex items-center justify-center shadow-inner">
        <img id="header-avatar" src="icon.png" onerror="this.src='https://via.placeholder.com/36'" class="w-full h-full rounded-full object-cover bg-slate-800" alt="App Icon">
        <div class="absolute -bottom-0.5 -right-0.5 bg-purple-600 w-3.5 h-3.5 rounded-full flex items-center justify-center text-[7px] text-white shadow">
          <i class="fa-solid fa-camera"></i>
        </div>
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent">Ourie <span class="text-xs text-slate-400 font-normal">TIME CAPSULE</span></h1>
        <p id="header-sender-name" class="text-[10px] text-purple-300 font-medium">マイプロフィール: <span id="my-display-name">アウリー</span></p>
      </div>
    </div>
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-full px-3 py-1 flex items-center space-x-1.5 shadow-sm">
      <i class="fa-solid fa-phone text-xs text-purple-400"></i>
      <span class="text-xs font-medium text-slate-300">受話器 (耳あて)</span>
    </div>
  </header>

  <!-- PAGE 1: 作成（カプセル送信）ページ -->
  <main id="page-create" class="flex-1 max-w-md w-full mx-auto px-4 py-5 space-y-5">

    <!-- 1. お届け先の選択＆プロフィール -->
    <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 shadow-sm space-y-3">
      <h2 class="text-xs font-bold text-slate-400 mb-2 flex items-center space-x-1.5">
        <i class="fa-solid fa-paper-plane text-purple-400"></i>
        <span>お届け先の選択</span>
      </h2>

      <div class="grid grid-cols-2 gap-2">
        <button id="target-self-btn" onclick="selectTarget('self')" type="button" class="py-2.5 px-3 rounded-xl bg-purple-600 text-white font-semibold text-xs flex items-center justify-center space-x-2 shadow-md transition-all">
          <i class="fa-solid fa-user"></i>
          <span>未来の自分へ</span>
        </button>
        <button id="target-friend-btn" onclick="selectTarget('friend')" type="button" class="py-2.5 px-3 rounded-xl bg-slate-800/80 text-slate-400 font-medium text-xs flex items-center justify-center space-x-2 transition-all">
          <i class="fa-solid fa-users"></i>
          <span>友達へ届ける</span>
        </button>
      </div>

      <!-- 送信者プロフィールカード -->
      <div id="self-profile-card" class="bg-slate-950/60 border border-slate-800 rounded-xl p-3 flex items-center justify-between transition-all">
        <div class="flex items-center space-x-3 flex-1">
          <img id="profile-avatar" src="icon.png" class="w-10 h-10 rounded-full object-cover border border-purple-500/30">
          <div>
            <div class="flex items-center space-x-1.5">
              <p id="profile-role" class="text-[10px] text-purple-400 font-medium">送信者</p>
              <button type="button" onclick="copyMyID()" class="text-[9px] bg-purple-950/80 hover:bg-purple-900 text-purple-300 border border-purple-500/30 px-1.5 py-0.5 rounded font-mono flex items-center space-x-1">
                <span id="my-ourie-id-display">@id</span>
                <i class="fa-regular fa-copy text-[8px]"></i>
              </button>
            </div>
            <p id="profile-name" class="text-xs font-bold text-slate-200">過去の自分</p>
          </div>
        </div>

        <button id="custom-name-btn" type="button" onclick="editCustomSenderName()" class="hidden px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-purple-300 text-[11px] font-medium rounded-lg border border-slate-700/60 flex items-center space-x-1">
          <i class="fa-solid fa-pen text-[9px]"></i>
          <span>この送信での名前変更</span>
        </button>
      </div>

      <!-- 友達指定エリア -->
      <div id="friend-select-area" class="hidden space-y-2.5 pt-1 border-t border-slate-800/80">
        <div id="friend-dropdown-container">
          <label class="text-[10px] text-slate-400 font-medium mb-1 block">交換済みの友達から選ぶ</label>
          <div class="flex space-x-2">
            <select id="friend-list-select" onchange="onFriendSelected(this.value)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
              <option value="">-- 友達を選択してください --</option>
            </select>
            <button id="delete-friend-btn" type="button" onclick="deleteSelectedFriend()" class="hidden px-3 py-2 bg-red-950/60 hover:bg-red-900/80 text-red-400 border border-red-500/30 text-xs font-medium rounded-xl transition-all flex items-center space-x-1">
              <i class="fa-solid fa-trash-can text-[10px]"></i>
              <span>削除</span>
            </button>
          </div>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 font-medium mb-1 block">新しい Ourie ID を追加して指定</label>
          <div class="flex space-x-2">
            <input type="text" id="friend-id-input" placeholder="例: @ou_x9a2f" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
            <button type="button" onclick="searchFriendByID()" class="px-3 py-2 bg-purple-600 hover:bg-purple-500 text-xs font-medium rounded-xl text-white shadow-sm transition-all">
              設定
            </button>
          </div>
        </div>

        <div id="selected-recipient-badge" class="hidden bg-purple-950/40 border border-purple-500/30 rounded-xl p-2.5 flex items-center justify-between">
          <div class="flex items-center space-x-2.5">
            <img id="recipient-avatar" src="icon.png" class="w-7 h-7 rounded-full object-cover">
            <div>
              <p class="text-[9px] text-purple-300 font-medium">送信先ユーザー</p>
              <p id="recipient-name" class="text-xs font-bold text-white">---</p>
            </div>
          </div>
          <button type="button" onclick="renameCurrentFriend()" class="text-[10px] font-mono text-purple-300 bg-purple-900/60 hover:bg-purple-800 px-2 py-0.5 rounded-full border border-purple-500/30 flex items-center space-x-1">
            <span id="recipient-id-tag">@id</span>
            <i class="fa-solid fa-pen text-[8px] ml-1"></i>
          </button>
        </div>
      </div>

      <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="handleAvatarChange(event)">
    </section>

    <!-- 2. 録音＆画像添付セクション -->
    <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 shadow-sm text-center">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xs font-bold text-slate-400 flex items-center space-x-1.5">
          <i class="fa-solid fa-microphone text-purple-400"></i>
          <span>未来へ届ける声を録音</span>
        </h2>
        <span id="recording-timer" class="font-mono text-xs text-slate-400 bg-slate-800 px-2.5 py-0.5 rounded-full">00:00</span>
      </div>

      <div class="my-3 flex justify-center">
        <button id="mic-btn" onclick="toggleRecording()" type="button" class="w-20 h-20 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 hover:from-purple-500 hover:to-indigo-400 text-white flex flex-col items-center justify-center shadow-lg shadow-purple-900/30 active:scale-95 transition-all">
          <i id="mic-icon" class="fa-solid fa-microphone text-2xl"></i>
        </button>
      </div>
      <p id="mic-status" class="text-xs font-medium text-slate-400 mt-2">タップして録音開始</p>

      <div id="preview-area" class="hidden mt-4 pt-4 border-t border-slate-800/80 space-y-3">
        <div class="flex items-center justify-between text-xs text-slate-300 px-1">
          <span class="flex items-center space-x-1.5 font-medium">
            <i class="fa-solid fa-headphones text-purple-400"></i>
            <span>録音音声の確認</span>
          </span>
          <span id="preview-duration" class="font-mono text-slate-400">00:00</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="playAudio(false)" type="button" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium flex items-center justify-center space-x-1.5 transition-all active:scale-95 border border-slate-700/50">
            <i class="fa-solid fa-phone text-purple-400"></i>
            <span>受話器で確認</span>
          </button>
          <button onclick="playAudio(true)" type="button" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium flex items-center justify-center space-x-1.5 transition-all active:scale-95 border border-slate-700/50">
            <i class="fa-solid fa-volume-high text-indigo-400"></i>
            <span>スピーカー確認</span>
          </button>
        </div>
      </div>

      <div class="mt-4 pt-4 border-t border-slate-800/80">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-400 flex items-center space-x-1.5">
            <i class="fa-regular fa-image text-indigo-400"></i>
            <span>一緒にメッセージ写真を添える（任意）</span>
          </span>
          <button type="button" onclick="document.getElementById('message-image-input').click()" class="text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-300 border border-slate-700/60 font-medium transition-all">
            <i class="fa-solid fa-plus text-[10px] mr-1"></i>写真を選択
          </button>
        </div>

        <div id="image-preview-container" class="hidden relative mt-2 rounded-xl overflow-hidden border border-purple-500/30 max-h-48 bg-slate-950/80 flex items-center justify-center">
          <img id="message-image-preview" src="" class="max-h-48 w-full object-contain">
          <button type="button" onclick="removeAttachedImage()" class="absolute top-2 right-2 bg-slate-900/80 hover:bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs shadow-md transition-all">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <input type="file" id="message-image-input" accept="image/*" class="hidden" onchange="handleMessageImageAttach(event)">
      </div>
    </section>

    <!-- 3. 日時選択 -->
    <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 shadow-sm space-y-3">
      <h2 class="text-xs font-bold text-slate-400 flex items-center space-x-1.5">
        <i class="fa-regular fa-clock text-purple-400"></i>
        <span>お届け日時 (着信日時)</span>
      </h2>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="setTimeOffset(10)" type="button" class="py-2 px-2 rounded-xl bg-slate-800 hover:bg-purple-950/40 hover:border-purple-500/50 border border-slate-700/60 text-slate-300 text-xs font-medium flex items-center justify-center space-x-1 transition-all">
          <i class="fa-solid fa-bolt text-yellow-400 text-[10px]"></i>
          <span>10秒後テスト</span>
        </button>
        <button onclick="setTimeOffset(60)" type="button" class="py-2 px-2 rounded-xl bg-slate-800 hover:bg-purple-950/40 hover:border-purple-500/50 border border-slate-700/60 text-slate-300 text-xs font-medium flex items-center justify-center space-x-1 transition-all">
          <i class="fa-solid fa-stopwatch text-purple-400 text-[10px]"></i>
          <span>1分後</span>
        </button>
        <button onclick="setTimeOffset(3600)" type="button" class="py-2 px-2 rounded-xl bg-slate-800 hover:bg-purple-950/40 hover:border-purple-500/50 border border-slate-700/60 text-slate-300 text-xs font-medium flex items-center justify-center space-x-1 transition-all">
          <i class="fa-regular fa-calendar-days text-indigo-400 text-[10px]"></i>
          <span>1時間後</span>
        </button>
      </div>
      <input type="datetime-local" id="target-time-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
    </section>

    <!-- 4. 送信（予約）ボタン -->
    <div class="pt-2">
      <button id="submit-btn" onclick="scheduleCapsule()" disabled type="button" class="w-full py-4 bg-slate-800 text-slate-500 font-bold text-sm rounded-xl flex items-center justify-center space-x-2 transition-all cursor-not-allowed shadow-md">
        <i class="fa-solid fa-paper-plane"></i>
        <span>タイムカプセルを送信・予約する</span>
      </button>
    </div>
  </main>

  <!-- PAGE 2: 届いたタイムカプセル一覧 -->
  <main id="page-history" class="hidden flex-1 max-w-md w-full mx-auto px-4 py-5 space-y-4">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-sm font-bold text-slate-200 flex items-center space-x-2">
        <i class="fa-solid fa-box-archive text-purple-400"></i>
        <span>届いたタイムカプセル</span>
      </h2>
      <span id="history-count" class="text-xs text-purple-300 bg-purple-950/80 border border-purple-500/30 px-2.5 py-0.5 rounded-full font-mono">0件</span>
    </div>

    <div id="history-list" class="space-y-3">
      <p id="history-empty-text" class="text-xs text-slate-500 text-center py-12">届いたタイムカプセルはまだありません</p>
    </div>
  </main>

  <!-- ボトムナビゲーション -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800/80 z-30 flex justify-around py-2">
    <button id="nav-btn-create" onclick="switchPage('create')" type="button" class="flex flex-col items-center space-y-1 text-purple-400 font-bold transition-all">
      <i class="fa-solid fa-pen-to-square text-lg"></i>
      <span class="text-[10px]">カプセル作成</span>
    </button>
    <button id="nav-btn-history" onclick="switchPage('history')" type="button" class="flex flex-col items-center space-y-1 text-slate-500 hover:text-slate-300 transition-all relative">
      <i class="fa-solid fa-box-archive text-lg"></i>
      <span class="text-[10px]">カプセル一覧</span>
      <span id="nav-badge" class="hidden absolute -top-1 right-3 w-2 h-2 bg-purple-500 rounded-full animate-ping"></span>
    </button>
  </nav>

  <!-- 個別詳細確認モーダル -->
  <div id="detail-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm space-y-4 relative shadow-2xl max-h-[85vh] overflow-y-auto">
      <button onclick="closeDetailModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="flex items-center space-x-3 pt-1">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 p-0.5">
          <img id="detail-avatar" src="icon.png" class="w-full h-full rounded-full object-cover">
        </div>
        <div>
          <h3 id="detail-sender-name" class="text-sm font-bold text-white">過去の自分</h3>
          <p id="detail-date" class="text-[10px] text-slate-400 font-mono">2026/09/29 12:00</p>
        </div>
      </div>

      <div id="detail-image-container" class="hidden rounded-xl overflow-hidden border border-purple-500/30 bg-slate-950 max-h-60 flex items-center justify-center">
        <img id="detail-image" src="" class="max-h-60 w-full object-contain">
      </div>

      <div class="grid grid-cols-2 gap-2 pt-2">
        <button id="detail-play-earpiece-btn" onclick="" type="button" class="py-2.5 px-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold flex items-center justify-center space-x-1.5 shadow-md">
          <i class="fa-solid fa-phone"></i>
          <span>受話器で再生</span>
        </button>
        <button id="detail-play-speaker-btn" onclick="" type="button" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center justify-center space-x-1.5 border border-slate-700">
          <i class="fa-solid fa-volume-high text-indigo-400"></i>
          <span>スピーカー</span>
        </button>
      </div>

      <div class="pt-3 border-t border-slate-800/80 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-400">返信ボイスメッセージ</span>
          <button onclick="openReplyModalFromDetail()" type="button" class="text-xs text-purple-300 hover:text-purple-200 font-medium flex items-center space-x-1 bg-purple-950/60 border border-purple-500/30 px-2.5 py-1 rounded-lg">
            <i class="fa-solid fa-reply text-[10px]"></i>
            <span>返信する</span>
          </button>
        </div>
        <div id="detail-reply-list" class="space-y-1.5 text-xs text-slate-300">
        </div>
      </div>
    </div>
  </div>

  <!-- 着信モーダル -->
  <div id="incoming-modal" class="hidden fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-lg flex flex-col items-center justify-between p-6 overflow-y-auto">
    <div class="pt-8 text-center space-y-3 w-full max-w-sm">
      <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 p-1 mx-auto shadow-2xl">
        <img id="incoming-avatar" src="icon.png" class="w-full h-full rounded-full object-cover">
      </div>
      <h3 id="incoming-name" class="text-xl font-bold text-white">過去の自分</h3>
      
      <p id="incoming-status-text" class="text-xs text-purple-400 animate-bounce">タイムカプセルが届きました</p>
      <p id="call-timer-text" class="hidden font-mono text-sm font-semibold text-green-400">00:00</p>

      <div id="incoming-attached-image-container" class="hidden mt-4 rounded-2xl overflow-hidden border border-purple-500/40 shadow-2xl bg-slate-900 max-h-64 flex items-center justify-center">
        <img id="incoming-attached-image" src="" class="max-h-64 w-full object-contain">
      </div>

      <div id="reply-action-area" class="hidden mt-3">
        <button type="button" onclick="openReplyModal()" class="w-full py-2.5 px-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs flex items-center justify-center space-x-2 shadow-lg transition-all active:scale-95">
          <i class="fa-solid fa-reply"></i>
          <span>届いた声に返信する</span>
        </button>
      </div>
    </div>

    <div id="incoming-actions" class="w-full max-w-xs py-8 flex justify-around">
      <button onclick="declineCall()" class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center text-xl shadow-lg active:scale-95">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
      <button onclick="acceptCall()" class="w-16 h-16 rounded-full bg-green-500 hover:bg-green-400 text-white flex items-center justify-center text-xl shadow-lg active:scale-95 animate-bounce">
        <i class="fa-solid fa-phone"></i>
      </button>
    </div>

    <div id="in-call-actions" class="hidden w-full max-w-xs py-8 flex justify-center">
      <button onclick="declineCall()" class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center text-xl shadow-lg active:scale-95">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
    </div>
  </div>

  <!-- 返信モーダル -->
  <div id="reply-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm space-y-4 relative shadow-2xl">
      <button onclick="closeReplyModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 class="text-sm font-bold text-purple-300 flex items-center space-x-2">
        <i class="fa-solid fa-reply"></i>
        <span><span id="reply-target-name">過去の自分</span> へ声の返信</span>
      </h3>

      <div class="text-center py-3">
        <button id="reply-mic-btn" onclick="toggleReplyRecording()" type="button" class="w-16 h-16 mx-auto rounded-full bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center text-2xl shadow-lg active:scale-95 transition-all">
          <i id="reply-mic-icon" class="fa-solid fa-microphone"></i>
        </button>
        <p id="reply-status" class="text-xs text-slate-400 mt-2">タップして返信ボイスを録音</p>
        <p id="reply-timer" class="font-mono text-xs text-purple-400 font-semibold mt-1">00:00</p>
      </div>

      <button id="send-reply-btn" onclick="sendVoiceReply()" disabled type="button" class="w-full py-3 bg-slate-800 text-slate-500 text-xs font-bold rounded-xl flex items-center justify-center space-x-1.5 transition-all cursor-not-allowed">
        <i class="fa-solid fa-paper-plane"></i>
        <span>返信ボイスを保存・送信</span>
      </button>
    </div>
  </main>

    let snapshotUnsubscribe = null;

    try {
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        const firebaseConfig = {
          apiKey: "AIzaSyDIf4qHuuWIM6CHxrTzYPf1jde7lBubdSQ",
          authDomain: "ourie-b6249.firebaseapp.com",
          projectId: "ourie-b6249",
          storageBucket: "ourie-b6249.firebasestorage.app",
          messagingSenderId: "989152519117",
          appId: "1:989152519117:web:8f11165502c3b04e725a84"
        };
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      }
    } catch(e) {
      console.log("Firebase fallback mode:", e);
    }

    let isRecording = false;
    let recTimer = null;
    let recSeconds = 0;
    let audioFilePath = "";
    let nativeRecorder = null;
    let nativePlayer = null;
    let webMediaRecorder = null;
    let audioChunks = [];
    let targetMode = 'self';

    let masterMyName = "アウリー";
    let myOurieID = "";
    let customSenderName = "";
    let attachedImageBase64 = "";
    let callTimerInterval = null;
    let callSeconds = 0;
    let imageAlreadyShown = false;

    let recipientUserId = "";
    let recipientUserName = "";

    let currentActiveCapsule = null;
    let selectedDetailCapsule = null;
    let capsuleHistory = [];
    let friendList = [];

    let isReplyRecording = false;
    let replyTimer = null;
    let replySeconds = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      setTimeOffset(60);
      initMyOurieID();
      syncProfileName();
      loadHistoryFromStorage();
      loadFriendsFromStorage();

      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        try {
          await LocalNotifications.requestPermissions();
          LocalNotifications.addListener('localNotificationActionPerformed', () => {
            triggerIncomingCall();
          });
        } catch(e) { console.error(e); }
      }
    });

    function initMyOurieID() {
      let savedID = localStorage.getItem('my_ourie_id');
      if (!savedID || savedID.startsWith('@ourie_')) {
        const randomHex = Math.random().toString(36).substring(2, 7);
        savedID = `@ou_${randomHex}`;
        localStorage.setItem('my_ourie_id', savedID);
      }
      myOurieID = savedID;
      const displayElem = document.getElementById('my-ourie-id-display');
      if (displayElem) displayElem.innerText = myOurieID;
      
      if (db) listenForIncomingCapsules();
    }

    function copyMyID() {
      navigator.clipboard.writeText(myOurieID).then(() => {
        alert(`あなたの Ourie ID (${myOurieID}) をコピーしました！友達に共有してください。`);
      }).catch(() => {
        alert(`あなたの Ourie ID は [ ${myOurieID} ] です。`);
      });
    }

    function loadFriendsFromStorage() {
      const saved = localStorage.getItem('ourie_friends');
      if (saved) {
        try { 
          friendList = JSON.parse(saved);
          const uniqueMap = new Map();
          friendList.forEach(f => {
            if (!uniqueMap.has(f.id)) {
              if (!f.name || f.name.startsWith('ユーザー (')) {
                f.name = `友達 (${f.id})`;
              }
              uniqueMap.set(f.id, f);
            }
          });
          friendList = Array.from(uniqueMap.values());
          localStorage.setItem('ourie_friends', JSON.stringify(friendList));
        } catch(e) {}
      }
      renderFriendDropdown();
    }

    function renderFriendDropdown() {
      const select = document.getElementById('friend-list-select');
      if (!select) return;

      select.innerHTML = '<option value="">-- 友達を選択してください --</option>';
      friendList.forEach(friend => {
        const opt = document.createElement('option');
        opt.value = friend.id;
        opt.setAttribute('data-name', friend.name);
        opt.setAttribute('data-avatar', friend.avatar || 'icon.png');
        opt.innerText = `${friend.name} (${friend.id})`;
        select.appendChild(opt);
      });
    }

    function saveFriendToList(id, name, avatar = 'icon.png') {
      const existingIdx = friendList.findIndex(f => f.id === id);
      if (existingIdx >= 0) {
        friendList[existingIdx].name = name;
      } else {
        friendList.push({ id, name, avatar });
      }
      localStorage.setItem('ourie_friends', JSON.stringify(friendList));
      renderFriendDropdown();
    }

    function deleteSelectedFriend() {
      if (!recipientUserId) return;
      const targetObj = friendList.find(f => f.id === recipientUserId);
      const name = targetObj ? targetObj.name : recipientUserId;

      if (confirm(`「${name}」を友達リストから削除しますか？`)) {
        friendList = friendList.filter(f => f.id !== recipientUserId);
        localStorage.setItem('ourie_friends', JSON.stringify(friendList));
        
        recipientUserId = "";
        recipientUserName = "";
        
        document.getElementById('friend-list-select').value = "";
        document.getElementById('selected-recipient-badge').classList.add('hidden');
        document.getElementById('delete-friend-btn').classList.add('hidden');
        
        renderFriendDropdown();
        alert("友達リストから削除しました。");
        validateAndCheckSubmit();
      }
    }

    function renameCurrentFriend() {
      if (!recipientUserId) return;
      const currentObj = friendList.find(f => f.id === recipientUserId);
      const currentName = currentObj ? currentObj.name : recipientUserName;
      
      const newName = prompt(`「${recipientUserId}」の表示名（ニックネーム）を入力してください:`, currentName);
      if (newName && newName.trim() !== "") {
        saveFriendToList(recipientUserId, newName.trim());
        setRecipientInfo(recipientUserId, newName.trim(), "icon.png");
        const select = document.getElementById('friend-list-select');
        if (select) select.value = recipientUserId;
      }
    }

    function switchPage(page) {
      const pageCreate = document.getElementById('page-create');
      const pageHistory = document.getElementById('page-history');
      const btnCreate = document.getElementById('nav-btn-create');
      const btnHistory = document.getElementById('nav-btn-history');

      if (page === 'create') {
        pageCreate.classList.remove('hidden');
        pageHistory.classList.add('hidden');
        btnCreate.className = "flex flex-col items-center space-y-1 text-purple-400 font-bold transition-all";
        btnHistory.className = "flex flex-col items-center space-y-1 text-slate-500 hover:text-slate-300 transition-all relative";
      } else {
        pageHistory.classList.remove('hidden');
        pageCreate.classList.add('hidden');
        btnHistory.className = "flex flex-col items-center space-y-1 text-purple-400 font-bold transition-all relative";
        btnCreate.className = "flex flex-col items-center space-y-1 text-slate-500 hover:text-slate-300 transition-all";
        document.getElementById('nav-badge').classList.add('hidden');
      }
    }

    function editMyProfile() {
      document.getElementById('avatar-input').click();
    }

    function handleAvatarChange(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imageSrc = e.target.result;
          document.getElementById('header-avatar').src = imageSrc;
          document.getElementById('profile-avatar').src = imageSrc;
          document.getElementById('incoming-avatar').src = imageSrc;
        };
        reader.readAsDataURL(file);
      }

      setTimeout(() => {
        const newName = prompt(`基本の表示名を入力してください (現在のID: ${myOurieID}):`, masterMyName);
        if (newName && newName.trim() !== "") {
          masterMyName = newName.trim();
          document.getElementById('my-display-name').innerText = masterMyName;
          if (!customSenderName) syncProfileName();
        }
      }, 300);
    }

    function editCustomSenderName() {
      const current = customSenderName || masterMyName;
      const input = prompt("この送信で表示する名前を入力してください（空欄で基本名に戻る）:", current);
      if (input !== null) {
        customSenderName = input.trim();
        syncProfileName();
      }
    }

    function selectTarget(mode) {
      targetMode = mode;
      const selfBtn = document.getElementById('target-self-btn');
      const friendBtn = document.getElementById('target-friend-btn');
      const friendSelectArea = document.getElementById('friend-select-area');

      if (mode === 'self') {
        selfBtn.className = "py-2.5 px-3 rounded-xl bg-purple-600 text-white font-semibold text-xs flex items-center justify-center space-x-2 shadow-md transition-all";
        friendBtn.className = "py-2.5 px-3 rounded-xl bg-slate-800/80 text-slate-400 font-medium text-xs flex items-center justify-center space-x-2 transition-all";
        if (friendSelectArea) friendSelectArea.classList.add('hidden');
      } else {
        friendBtn.className = "py-2.5 px-3 rounded-xl bg-purple-600 text-white font-semibold text-xs flex items-center justify-center space-x-2 shadow-md transition-all";
        selfBtn.className = "py-2.5 px-3 rounded-xl bg-slate-800/80 text-slate-400 font-medium text-xs flex items-center justify-center space-x-2 transition-all";
        if (friendSelectArea) friendSelectArea.classList.remove('hidden');
      }

      syncProfileName();
      validateAndCheckSubmit();
    }

    function syncProfileName() {
      const pName = document.getElementById('profile-name');
      const pRole = document.getElementById('profile-role');
      const customBtn = document.getElementById('custom-name-btn');

      if (!pName) return;

      if (targetMode === 'self') {
        pName.innerText = "過去の自分";
        if (pRole) pRole.innerText = "送信者";
        if (customBtn) customBtn.classList.add('hidden');
      } else {
        const displayName = customSenderName ? customSenderName : masterMyName;
        pName.innerText = displayName;
        if (pRole) pRole.innerText = customSenderName ? "送信者（変更した名前）" : "送信者（マイプロフィール）";
        if (customBtn) customBtn.classList.remove('hidden');
      }
    }

    function onFriendSelected(userId) {
      if (!userId) {
        document.getElementById('delete-friend-btn').classList.add('hidden');
        return;
      }
      const select = document.getElementById('friend-list-select');
      const selectedOption = select.options[select.selectedIndex];
      const name = selectedOption.getAttribute('data-name');
      const avatar = selectedOption.getAttribute('data-avatar') || 'icon.png';
      setRecipientInfo(userId, name, avatar);
    }

    function searchFriendByID() {
      const inputId = document.getElementById('friend-id-input').value.trim();
      if (!inputId) return alert("Ourie IDを入力してください");

      const formattedID = inputId.startsWith('@') ? inputId : `@${inputId}`;
      const nickname = prompt(`「${formattedID}」の友達の表示名（ニックネーム）を入力してください:`, `友達`);
      
      const friendName = (nickname && nickname.trim() !== "") ? nickname.trim() : `友達`;

      saveFriendToList(formattedID, friendName);
      setRecipientInfo(formattedID, friendName, "icon.png");

      const select = document.getElementById('friend-list-select');
      if (select) select.value = formattedID;

      document.getElementById('friend-id-input').value = "";
      alert(`「${friendName} (${formattedID})」を送信先に設定＆保存しました！`);
    }

    function setRecipientInfo(id, name, avatar) {
      recipientUserId = id;
      recipientUserName = name;

      const rName = document.getElementById('recipient-name');
      const rId = document.getElementById('recipient-id-tag');
      const rAvatar = document.getElementById('recipient-avatar');
      const badge = document.getElementById('selected-recipient-badge');
      const delBtn = document.getElementById('delete-friend-btn');

      if (rName) rName.innerText = name;
      if (rId) rId.innerText = id;
      if (rAvatar) rAvatar.src = avatar;
      if (badge) badge.classList.remove('hidden');
      if (delBtn) delBtn.classList.remove('hidden');

      validateAndCheckSubmit();
    }

    function setTimeOffset(seconds) {
      const now = new Date(Date.now() + seconds * 1000);
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('target-time-input').value = now.toISOString().slice(0, 16);
    }

    function validateAndCheckSubmit() {
      const hasAudio = (audioFilePath !== "" || isRecording);
      let isRecipientValid = (targetMode === 'self') ? true : (recipientUserId && recipientUserId !== "");

      if (hasAudio || isRecipientValid) {
        setSubmitButtonState(true);
      }
    }

    function setSubmitButtonState(enabled) {
      const btn = document.getElementById('submit-btn');
      if (!btn) return;
      if (enabled) {
        btn.removeAttribute('disabled');
        btn.disabled = false;
        btn.className = "w-full py-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-sm rounded-xl flex items-center justify-center space-x-2 transition-all shadow-lg active:scale-98 cursor-pointer";
      } else {
        btn.setAttribute('disabled', 'true');
        btn.disabled = true;
        btn.className = "w-full py-4 bg-slate-800 text-slate-500 font-bold text-sm rounded-xl flex items-center justify-center space-x-2 transition-all cursor-not-allowed shadow-md";
      }
    }

    async function toggleRecording() {
      const micBtn = document.getElementById('mic-btn');
      const micIcon = document.getElementById('mic-icon');
      const micStatus = document.getElementById('mic-status');

      if (!isRecording) {
        try {
          audioFilePath = "ourie_capsule_" + Date.now() + ".m4a";
          if (window.Media) {
            nativeRecorder = new Media(audioFilePath, () => {}, (err) => console.error(err));
            nativeRecorder.startRecord();
          } else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioChunks = [];
            webMediaRecorder = new MediaRecorder(stream);
            webMediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            webMediaRecorder.onstop = () => {
              const blob = new Blob(audioChunks, { type: 'audio/mp3' });
              const reader = new FileReader();
              reader.onloadend = () => { audioFilePath = reader.result; };
              reader.readAsDataURL(blob);
            };
            webMediaRecorder.start();
          }
          isRecording = true;
          micBtn.className = "w-20 h-20 rounded-full bg-red-600 hover:bg-red-500 text-white flex flex-col items-center justify-center shadow-lg shadow-red-900/40 active:scale-95 transition-all animate-pulse";
          micIcon.className = "fa-solid fa-square text-2xl";
          micStatus.innerText = "録音中... タップで停止";

          recSeconds = 0;
          recTimer = setInterval(() => {
            recSeconds++;
            const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
            const s = String(recSeconds % 60).padStart(2, '0');
            document.getElementById('recording-timer').innerText = `${m}:${s}`;
          }, 1000);
        } catch (e) { alert("マイクの利用を許可してください: " + e.message); }
      } else {
        isRecording = false;
        clearInterval(recTimer);
        micBtn.className = "w-20 h-20 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 text-white flex flex-col items-center justify-center shadow-lg shadow-purple-900/30 active:scale-95 transition-all";
        micIcon.className = "fa-solid fa-microphone text-2xl";
        micStatus.innerText = "録音完了！";

        if (nativeRecorder) {
          try { nativeRecorder.stopRecord(); nativeRecorder.release(); } catch(e) {}
        }
        if (webMediaRecorder && webMediaRecorder.state !== "inactive") {
          try { webMediaRecorder.stop(); } catch(e) {}
        }

        const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
        const s = String(recSeconds % 60).padStart(2, '0');
        document.getElementById('preview-duration').innerText = `${m}:${s}`;
        document.getElementById('preview-area').classList.remove('hidden');

        validateAndCheckSubmit();
      }
    }

    function handleMessageImageAttach(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        attachedImageBase64 = e.target.result;
        const previewImg = document.getElementById('message-image-preview');
        const container = document.getElementById('image-preview-container');
        if (previewImg && container) {
          previewImg.src = attachedImageBase64;
          container.classList.remove('hidden');
        }
      };
      reader.readAsDataURL(file);
    }

    function removeAttachedImage() {
      attachedImageBase64 = "";
      const input = document.getElementById('message-image-input');
      const previewImg = document.getElementById('message-image-preview');
      const container = document.getElementById('image-preview-container');

      if (input) input.value = "";
      if (previewImg) previewImg.src = "";
      if (container) container.classList.add('hidden');
    }

    async function scheduleCapsule() {
      try {
        const inputVal = document.getElementById('target-time-input').value;
        if (!inputVal) return alert("お届け日時を選択してください");

        const targetRecipientID = (targetMode === 'friend') ? recipientUserId : myOurieID;
        if (targetMode === 'friend' && !targetRecipientID) {
          return alert("お届け先の Ourie ID を設定してください");
        }

        const targetTime = new Date(inputVal).getTime();
        const delay = targetTime - Date.now();

        if (delay <= 0) return alert("未来の日時を選択してください");

        let displayName = "過去の自分";
        if (targetMode === 'friend') {
          displayName = customSenderName ? customSenderName : masterMyName;
        }

        const capsuleData = {
          senderId: myOurieID,
          senderName: displayName,
          senderAvatar: null,
          recipientId: targetRecipientID,
          targetTimestamp: targetTime,
          audioUrl: audioFilePath,
          photoData: attachedImageBase64,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (db) {
          try {
            await db.collection('capsules').add(capsuleData);
          } catch(e) { console.error("Firestore Save Error:", e); }
        }

        if (targetRecipientID === myOurieID) {
          setTimeout(() => {
            triggerIncomingCall(displayName, audioFilePath, attachedImageBase64);
          }, delay);
        }

        alert(`タイムカプセルを送信・予約しました！ (送信先: ${recipientUserName || targetRecipientID})`);

        audioFilePath = "";
        attachedImageBase64 = "";
        removeAttachedImage();
        document.getElementById('preview-area').classList.add('hidden');
        document.getElementById('recording-timer').innerText = "00:00";
        setTimeOffset(60);

      } catch (err) {
        console.error("Schedule Error:", err);
        alert("予約処理中にエラーが発生しました: " + err.message);
      }
    }

    // 起動時の過去着信自動立ち上がり防止付きリアルタイム監視
    function listenForIncomingCapsules() {
      if (!db || !myOurieID) return;

      if (snapshotUnsubscribe) {
        snapshotUnsubscribe();
      }

      try {
        snapshotUnsubscribe = db.collection('capsules')
          .where('recipientId', '==', myOurieID)
          .onSnapshot((snapshot) => {
            snapshot.docChanges().forEach((change) => {
              if (change.type === 'added') {
                const data = change.doc.data();
                
                // Firestoreのタイムスタンプまたは現在時刻との比較
                const createdTime = data.createdAt ? data.createdAt.toMillis() : Date.now();
                const delay = data.targetTimestamp - Date.now();

                // アプリ起動より後に送信されたデータ、または指定日時がまだ未来のデータのみ着信を起こす
                if (createdTime >= (appStartTime - 5000) || delay > 0) {
                  if (delay > 0) {
                    setTimeout(() => {
                      triggerIncomingCall(data.senderName, data.audioUrl, data.photoData);
                    }, delay);
                  } else {
                    triggerIncomingCall(data.senderName, data.audioUrl, data.photoData);
                  }
                } else {
                  // アプリ起動前の過去データは履歴としてのみ読み込み
                  saveCapsuleToHistory({
                    id: change.doc.id,
                    senderName: data.senderName,
                    audioPath: data.audioUrl,
                    image: data.photoData,
                    date: new Date(data.targetTimestamp).toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    replies: []
                  });
                }
              }
            });
          }, (err) => console.error("Snapshot Error:", err));
      } catch(e) { console.error("Listen Error:", e); }
    }

    function triggerIncomingCall(senderName, audioUrl, photoData) {
      currentActiveCapsule = {
        id: "capsule_" + Date.now(),
        senderName: senderName || "過去の自分",
        audioPath: audioUrl || audioFilePath,
        image: photoData || attachedImageBase64,
        date: new Date().toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        replies: []
      };

      document.getElementById('incoming-name').innerText = currentActiveCapsule.senderName;
      const imgContainer = document.getElementById('incoming-attached-image-container');
      if (imgContainer) imgContainer.classList.add('hidden');
      document.getElementById('reply-action-area').classList.add('hidden');

      document.getElementById('incoming-modal').classList.remove('hidden');
    }

    function acceptCall() {
      imageAlreadyShown = false;
      const actions = document.getElementById('incoming-actions');
      const inCallActions = document.getElementById('in-call-actions');
      const statusText = document.getElementById('incoming-status-text');
      const timerText = document.getElementById('call-timer-text');
      const replyArea = document.getElementById('reply-action-area');
      const imgContainer = document.getElementById('incoming-attached-image-container');

      if (actions) actions.classList.add('hidden');
      if (inCallActions) inCallActions.classList.remove('hidden');
      if (statusText) statusText.classList.add('hidden');
      if (replyArea) replyArea.classList.remove('hidden');
      
      if (imgContainer) {
        imgContainer.classList.add('hidden');
        imgContainer.className = "hidden mt-4 rounded-2xl overflow-hidden border border-purple-500/40 shadow-2xl bg-slate-900 max-h-64 flex items-center justify-center transition-all duration-700 opacity-0 scale-95";
      }

      if (timerText) {
        timerText.classList.remove('hidden');
        timerText.innerText = "00:00";
      }

      callSeconds = 0;
      clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const s = String(callSeconds % 60).padStart(2, '0');
        if (timerText) timerText.innerText = `${m}:${s}`;
      }, 1000);

      playAudio(false, currentActiveCapsule ? currentActiveCapsule.audioPath : null);

      saveCapsuleToHistory(currentActiveCapsule);
      document.getElementById('nav-badge').classList.remove('hidden');

      const delayMs = (recSeconds > 0) ? (recSeconds * 1000) : 3000;
      setTimeout(() => {
        showAttachedImageAfterAudio();
      }, delayMs);
    }

    function declineCall() {
      clearInterval(callTimerInterval);
      if (nativePlayer) { 
        try { nativePlayer.stop(); nativePlayer.release(); } catch(e) {} 
      }

      const img = currentActiveCapsule ? currentActiveCapsule.image : attachedImageBase64;
      if (img && img !== "" && !imageAlreadyShown) {
        showAttachedImageAfterAudio();
        saveCapsuleToHistory(currentActiveCapsule);
        return;
      }

      closeIncomingModal();
    }

    function closeIncomingModal() {
      imageAlreadyShown = false;
      currentActiveCapsule = null;

      const modal = document.getElementById('incoming-modal');
      const actions = document.getElementById('incoming-actions');
      const inCallActions = document.getElementById('in-call-actions');
      const statusText = document.getElementById('incoming-status-text');
      const timerText = document.getElementById('call-timer-text');

      if (modal) modal.classList.add('hidden');
      if (actions) actions.classList.remove('hidden');
      if (inCallActions) inCallActions.classList.add('hidden');
      if (statusText) statusText.classList.remove('hidden');
      if (timerText) timerText.classList.add('hidden');
    }

    function showAttachedImageAfterAudio() {
      const imgData = currentActiveCapsule ? currentActiveCapsule.image : attachedImageBase64;
      if (imgData && imgData !== "" && !imageAlreadyShown) {
        imageAlreadyShown = true;
        const img = document.getElementById('incoming-attached-image');
        const container = document.getElementById('incoming-attached-image-container');
        if (img && container) {
          img.src = imgData;
          container.classList.remove('hidden');
          
          setTimeout(() => {
            container.className = "mt-4 rounded-2xl overflow-hidden border border-purple-500/40 shadow-2xl bg-slate-900 max-h-64 flex items-center justify-center transition-all duration-700 ease-out opacity-100 scale-100";
          }, 50);
        }
      }
    }

    function playAudio(forceSpeaker, customPath = null) {
      const targetPath = customPath || (currentActiveCapsule ? currentActiveCapsule.audioPath : audioFilePath);
      if (!targetPath) return;

      if (targetPath.startsWith("data:") || targetPath.startsWith("http")) {
        const audio = new Audio(targetPath);
        audio.play().catch(e => console.error(e));
        return;
      }

      if (nativePlayer) { 
        try { nativePlayer.stop(); nativePlayer.release(); } catch(e) {} 
      }

      const toggle = window.AudioToggle || (window.cordova && window.cordova.plugins && window.cordova.plugins.AudioToggle);
      if (toggle && typeof toggle.setAudioMode === 'function') {
        toggle.setAudioMode(forceSpeaker ? "speaker" : "earpiece");
      }

      if (window.Media && targetPath) {
        nativePlayer = new Media(
          targetPath,
          () => {
            if (toggle && typeof toggle.setAudioMode === 'function') toggle.setAudioMode("speaker");
          },
          (err) => console.error(err)
        );
        nativePlayer.play();
      }
    }

    function saveCapsuleToHistory(capsule) {
      if (!capsule) return;
      const exists = capsuleHistory.some(item => item.id === capsule.id);
      if (!exists) {
        capsuleHistory.unshift(capsule);
        renderHistory();
        localStorage.setItem('ourie_capsules', JSON.stringify(capsuleHistory));
      }
    }

    function loadHistoryFromStorage() {
      const saved = localStorage.getItem('ourie_capsules');
      if (saved) {
        try {
          capsuleHistory = JSON.parse(saved);
          renderHistory();
        } catch(e) { console.error(e); }
      }
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const count = document.getElementById('history-count');
      const emptyText = document.getElementById('history-empty-text');

      if (!list) return;
      count.innerText = `${capsuleHistory.length}件`;

      if (capsuleHistory.length === 0) {
        if (emptyText) emptyText.classList.remove('hidden');
        return;
      } else {
        if (emptyText) emptyText.classList.add('hidden');
      }

      list.innerHTML = "";
      capsuleHistory.forEach(item => {
        const card = document.createElement('div');
        card.onclick = () => openDetailModal(item);
        card.className = "bg-slate-900 border border-slate-800 hover:border-purple-500/40 rounded-xl p-3.5 flex items-center justify-between cursor-pointer transition-all active:scale-98 shadow-sm";

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-900 to-slate-800 border border-purple-500/30 flex items-center justify-center text-purple-300">
              <i class="fa-solid fa-envelope-open text-sm"></i>
            </div>
            <div>
              <p class="text-xs font-bold text-slate-100">${item.senderName}</p>
              <p class="text-[10px] text-slate-400 font-mono mt-0.5">${item.date}</p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            ${item.image ? '<i class="fa-regular fa-image text-xs text-indigo-400"></i>' : ''}
            ${item.replies && item.replies.length > 0 ? `<span class="text-[9px] bg-purple-950 text-purple-300 px-2 py-0.5 rounded-full border border-purple-500/30 flex items-center space-x-1"><i class="fa-solid fa-reply text-[8px]"></i><span>${item.replies.length}</span></span>` : ''}
            <i class="fa-solid fa-chevron-right text-xs text-slate-600"></i>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function openDetailModal(item) {
      selectedDetailCapsule = item;

      document.getElementById('detail-sender-name').innerText = item.senderName;
      document.getElementById('detail-date').innerText = item.date;

      const imgContainer = document.getElementById('detail-image-container');
      const img = document.getElementById('detail-image');
      if (item.image) {
        img.src = item.image;
        imgContainer.classList.remove('hidden');
      } else {
        imgContainer.classList.add('hidden');
      }

      document.getElementById('detail-play-earpiece-btn').onclick = () => playAudio(false, item.audioPath);
      document.getElementById('detail-play-speaker-btn').onclick = () => playAudio(true, item.audioPath);

      const replyList = document.getElementById('detail-reply-list');
      replyList.innerHTML = "";
      if (item.replies && item.replies.length > 0) {
        item.replies.forEach((rep, idx) => {
          const repDiv = document.createElement('div');
          repDiv.className = "bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex items-center justify-between";
          repDiv.innerHTML = `
            <span class="text-[11px] text-purple-300 flex items-center space-x-1">
              <i class="fa-solid fa-microphone text-[10px]"></i>
              <span>返信ボイス #${idx + 1} (${rep.date})</span>
            </span>
            <button onclick="playAudio(true, '${rep.audio}')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-purple-300 rounded-md font-medium">聴く</button>
          `;
          replyList.appendChild(repDiv);
        });
      } else {
        replyList.innerHTML = `<p class="text-[11px] text-slate-500 py-1">返信ボイスはまだありません</p>`;
      }

      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function openReplyModal() {
      if (currentActiveCapsule) {
        selectedDetailCapsule = currentActiveCapsule;
        document.getElementById('reply-target-name').innerText = currentActiveCapsule.senderName;
      }
      document.getElementById('reply-modal').classList.remove('hidden');
    }

    function openReplyModalFromDetail() {
      if (selectedDetailCapsule) {
        document.getElementById('reply-target-name').innerText = selectedDetailCapsule.senderName;
      }
      document.getElementById('reply-modal').classList.remove('hidden');
    }

    function closeReplyModal() {
      document.getElementById('reply-modal').classList.add('hidden');
    }

    async function toggleReplyRecording() {
      const micBtn = document.getElementById('reply-mic-btn');
      const micIcon = document.getElementById('reply-mic-icon');
      const status = document.getElementById('reply-status');
      const timerText = document.getElementById('reply-timer');

      if (!isReplyRecording) {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioChunks = [];
            webMediaRecorder = new MediaRecorder(stream);
            webMediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            webMediaRecorder.onstop = () => {
              const blob = new Blob(audioChunks, { type: 'audio/mp3' });
              const reader = new FileReader();
              reader.onloadend = () => { audioFilePath = reader.result; };
              reader.readAsDataURL(blob);
            };
            webMediaRecorder.start();
          }
          isReplyRecording = true;
          micBtn.className = "w-16 h-16 mx-auto rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center text-2xl shadow-lg active:scale-95 transition-all animate-pulse";
          micIcon.className = "fa-solid fa-square";
          status.innerText = "返信録音中... タップで停止";

          replySeconds = 0;
          clearInterval(replyTimer);
          replyTimer = setInterval(() => {
            replySeconds++;
            const m = String(Math.floor(replySeconds / 60)).padStart(2, '0');
            const s = String(replySeconds % 60).padStart(2, '0');
            timerText.innerText = `${m}:${s}`;
          }, 1000);
        } catch(e) { alert("マイクの利用を許可してください: " + e.message); }
      } else {
        isReplyRecording = false;
        clearInterval(replyTimer);
        micBtn.className = "w-16 h-16 mx-auto rounded-full bg-purple-600 text-white flex items-center justify-center text-2xl shadow-lg active:scale-95";
        micIcon.className = "fa-solid fa-microphone";
        status.innerText = "返信録音完了！";

        if (webMediaRecorder && webMediaRecorder.state !== "inactive") {
          try { webMediaRecorder.stop(); } catch(e) {}
        }

        const btn = document.getElementById('send-reply-btn');
        btn.disabled = false;
        btn.className = "w-full py-3 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold rounded-xl flex items-center justify-center space-x-1.5 transition-all shadow-md cursor-pointer";
      }
    }

    function sendVoiceReply() {
      alert("返信ボイスを保存・送信しました！");
      
      if (selectedDetailCapsule) {
        const target = capsuleHistory.find(item => item.id === selectedDetailCapsule.id);
        if (target) {
          if (!target.replies) target.replies = [];
          target.replies.push({
            audio: audioFilePath,
            date: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
          });
          localStorage.setItem('ourie_capsules', JSON.stringify(capsuleHistory));
          renderHistory();
          openDetailModal(target);
        }
      }

      closeReplyModal();
      closeIncomingModal();
    }
  </script>
</body>
</html>
